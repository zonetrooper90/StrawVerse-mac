# Temporary, isolated Gallery preview in the StrawVerse repository.
# The working StrawVerse source/build branches are never changed by this workflow.
name: Gallery Playback Test | Apple Silicon

on:
  push:
    branches:
      - gallery/playback-subtitle-test
    paths:
      - '.github/workflows/gallery-preview-macos.yml'
      - 'gallery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-arm64:
    name: Package Gallery Playback Test (ARM64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
        working-directory: gallery
    steps:
      - name: Checkout the isolated Gallery playback-test branch
        uses: actions/checkout@v4

      - name: Confirm the native Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          sw_vers

      - name: Install Node.js on the CI runner only
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gallery dependencies on the CI runner only
        run: npm install --no-audit --no-fund

      - name: Validate Gallery sources and unit tests
        run: npm run check

      - name: Sign and package Gallery Playback Test
        env:
          CSC_LINK: ${{ secrets.GALLERY_MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.GALLERY_MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.GALLERY_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.GALLERY_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GALLERY_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "GALLERY_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            echo "Building a Developer ID-signed and notarized app"
            npm run pack:mac -- --config.mac.notarize=true
          elif [[ -n "${CSC_LINK:-}" || -n "${CSC_KEY_PASSWORD:-}" || -n "${APPLE_ID:-}" || -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "::error::Incomplete Apple signing credentials. All five Gallery secrets are required."
            exit 1
          else
            echo "GALLERY_SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::Ad-hoc test build only: without Apple Developer ID signing and notarization, macOS may still block first launch."
            npm run pack:mac -- --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false
          fi

      - name: Verify ARM64 application and create Finder-ready ZIP
        run: |
          set -euo pipefail
          APP_PATH=$(find dist -maxdepth 3 -type d -name 'Gallery Playback Test.app' -print -quit)
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Contents/Info.plist"
          test -f "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PLIST")
          test "$BUNDLE_ID" = 'dev.gallery.anime.playback-test'
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$PLIST")
          BIN="$APP_PATH/Contents/MacOS/$EXE"
          test -x "$BIN"
          echo 'Bundle executable:'
          file "$BIN"
          lipo -archs "$BIN" | grep -Eq '(^|[[:space:]])arm64($|[[:space:]])'
          if lipo -archs "$BIN" | grep -q x86_64; then
            echo 'Intel architecture unexpectedly included' >&2
            exit 1
          fi
          echo 'Checking the app signature before archiving'
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          if [[ "$GALLERY_SIGNING_MODE" = "developer-id" ]]; then
            spctl --assess --type exec --verbose=2 "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
          fi
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release/Gallery-Playback-Test-Apple-Silicon.zip
          unzip -t release/Gallery-Playback-Test-Apple-Silicon.zip >/dev/null
          echo '### Gallery Playback Test — Apple Silicon' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GALLERY_SIGNING_MODE" = "developer-id" ]]; then
            echo 'Developer ID signed, notarized, stapled, and verified. This distribution is designed to pass Gatekeeper.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ad-hoc development signature only; macOS Gatekeeper still requires user approval on a downloaded copy. To distribute without warnings, configure the Apple Developer signing/notarization secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload testable app
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Playback-Test-Apple-Silicon
          path: gallery/release/Gallery-Playback-Test-Apple-Silicon.zip
          if-no-files-found: error
          retention-days: 30
