# Isolated Gallery playback-testing branch; the original Gallery and StrawVerse branches are not modified.
name: Gallery Playback Test | Apple Silicon DMG

on:
  push:
    branches:
      - gallery/playback-subtitle-test
    paths:
      - '.github/workflows/gallery-preview-macos.yml'
      - 'gallery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-arm64:
    name: Build signed Gallery Playback Test DMG (ARM64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
        working-directory: gallery
    steps:
      - name: Checkout isolated Gallery playback-test branch
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          sw_vers

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gallery dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Gallery sources and subtitle tests
        run: npm run check

      - name: Package ad-hoc signed Apple Silicon DMG
        run: |
          set -euo pipefail
          npm run pack:mac

      - name: Verify signed app and mounted DMG
        run: |
          set -euo pipefail
          APP_PATH=$(find dist -maxdepth 3 -type d -name 'Gallery Playback Test.app' -print -quit)
          DMG_PATH="dist/Gallery-Playback-Test-arm64.dmg"
          test -n "$APP_PATH"
          test -s "$DMG_PATH"
          PLIST="$APP_PATH/Contents/Info.plist"
          test -f "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PLIST")
          test "$BUNDLE_ID" = 'dev.gallery.anime.playback-test'
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$PLIST")
          BIN="$APP_PATH/Contents/MacOS/$EXE"
          test -x "$BIN"
          echo 'Verifying ARM64 architecture'
          lipo -archs "$BIN" | grep -Eq '(^|[[:space:]])arm64($|[[:space:]])'
          if lipo -archs "$BIN" | grep -q x86_64; then
            echo "Intel architecture unexpectedly included" >&2
            exit 1
          fi
          echo 'Verifying the ad-hoc code signature'
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | grep -F 'Signature=adhoc'
          echo 'Verifying the packaged disk image'
          hdiutil verify "$DMG_PATH"
          MOUNT="$RUNNER_TEMP/gallery-playback-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$MOUNT" "$DMG_PATH"
          trap 'hdiutil detach -quiet "$MOUNT" || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Gallery Playback Test.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$MOUNT/Gallery Playback Test.app/Contents/Info.plist")" = 'dev.gallery.anime.playback-test'
          hdiutil detach -quiet "$MOUNT"
          trap - EXIT
          echo '### Gallery Playback Test — Apple Silicon DMG' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ad-hoc signed and code-signature verified, including inside the mounted DMG; same development-distribution method as the earlier StrawVerse Mac build. This app is not Apple-notarized and Gatekeeper may still require first-launch approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gallery Playback Test DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Playback-Test-Apple-Silicon-DMG
          path: gallery/dist/Gallery-Playback-Test-arm64.dmg
          if-no-files-found: error
          retention-days: 30
