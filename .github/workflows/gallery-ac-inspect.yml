name: Gallery A+C integration preflight
on:
  push:
    branches:
      - 'gallery/working-2026-11-10-ac-micro-depth'
    paths:
      - '.github/workflows/gallery-ac-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checksum-verify GitHub Gallery baseline before modification
        run: |
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 gallery/tools/restore-checkpoint.py --output "$RUNNER_TEMP/Gallery-current.html"
      - name: Inspect exact baseline transitions without modifying app
        env:
          SOURCE_FILE: ${{ runner.temp }}/Gallery-current.html
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          html=Path(os.environ['SOURCE_FILE']).read_text(encoding='utf-8')
          tokens=[
              ('body.settings-view',6,900,1400),
              ('#settings-page',6,900,1500),
              ('returning-to-gallery',6,800,1450),
              ('settingsClosing',5,500,900),
              ('function showSettings()',1,500,5100),
              ('function closeSettings',1,450,5400),
              ('function hideSettings',1,400,5100),
              ('function setSettingsSection',1,300,2500),
              ('function transitionGalleryStage',1,300,2400),
              ('transitionGalleryStage(',14,350,560),
              ('gallery-stage',5,200,500),
          ]
          for token,limit,before,after in tokens:
              print('\\n====== TOKEN:',repr(token),'======')
              start=0;count=0
              while count<limit:
                  n=html.find(token,start)
                  if n<0:break
                  print('\\n-- offset',n,'--')
                  print(html[max(0,n-before):min(len(html),n+after)])
                  start=n+len(token);count+=1
              print('Matches sampled:',count)
          print('\\n====== CALL SITES FOR showSettings / closeSettings / setSettingsSection ======')
          import re
          for call in ('showSettings(', 'closeSettings(', 'setSettingsSection('):
              hits=[m.start() for m in re.finditer(re.escape(call),html)]
              print('CALL',call,'COUNT',len(hits))
              for n in hits[:20]:
                  print('OFFSET',n,'CONTEXT',repr(html[max(0,n-150):n+220]))
          print('\\n====== WORKSPACE SETTINGS ELEMENT TREE ======')
          for key in ('id="workspace"','id="settings-page"','id="tab-pages-viewport"','id="screen"'):
              n=html.find(key);print(key,'OFFSET',n,repr(html[max(0,n-200):n+500]))
          PY
