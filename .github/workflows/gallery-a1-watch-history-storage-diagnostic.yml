name: Gallery A1 Watch History storage diagnostic
on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/audits/2026-11-15-a1-watch-history-storage-diagnostic.py'
permissions:
  contents: read
jobs:
  diagnose:
    name: A1 storage diagnostic (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [full, lightweight]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify immutable baseline and source assembly
        run: |
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 gallery/tools/build-gallery.py --check
      - uses: ./.github/actions/gallery-browser
      - name: Run isolated synthetic storage cases
        run: python3 -B gallery/audits/2026-11-15-a1-watch-history-storage-diagnostic.py "${{ matrix.mode }}"
      - name: Upload read-only diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: a1-storage-${{ matrix.mode }}
          path: ${{ runner.temp }}/a1-${{ matrix.mode }}.json
          if-no-files-found: error
      - name: Confirm no repository changes
        if: always()
        run: test -z "$(git status --porcelain)"
