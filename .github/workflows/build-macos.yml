name: Build standalone macOS apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/native-macos-build
    paths:
      - ".github/workflows/build-macos.yml"
      - "electron/**"
      - "backend/**"
      - "gui/**"
      - "package.json"

permissions:
  contents: read

jobs:
  macos:
    name: macOS - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple-Silicon
            runner: macos-15
            arch: arm64
            mpv_archive: mpv-v0.41.0-macos-14-arm.zip
            mpv_arch: arm64
          - label: Intel
            runner: macos-15-intel
            arch: x64
            mpv_archive: mpv-v0.41.0-macos-15-intel.zip
            mpv_arch: x86_64

    steps:
      - name: Check out the fork with macOS source changes
        uses: actions/checkout@v4

      - name: Set up Node.js on the hosted Mac
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Get official MPV macOS build
        shell: bash
        env:
          MPV_ARCHIVE: ${{ matrix.mpv_archive }}
          EXPECTED_ARCH: ${{ matrix.mpv_arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpv-extract" electron/mpv/darwin
          curl -fL --retry 4 --retry-all-errors \
            "https://github.com/mpv-player/mpv/releases/download/v0.41.0/$MPV_ARCHIVE" \
            -o "$RUNNER_TEMP/mpv.zip"
          unzip -q "$RUNNER_TEMP/mpv.zip" -d "$RUNNER_TEMP/mpv-extract"
          # The official MPV .zip contains a nested mpv.tar.gz archive.
          MPV_TAR="$(find "$RUNNER_TEMP/mpv-extract" -type f -name '*.tar.gz' -print -quit)"
          if [ -n "$MPV_TAR" ]; then
            tar -xzf "$MPV_TAR" -C "$RUNNER_TEMP/mpv-extract"
          fi
          MPV_APP="$(find "$RUNNER_TEMP/mpv-extract" -type d -name mpv.app -print -quit)"
          if [ -z "$MPV_APP" ]; then
            echo "The official MPV archive did not contain mpv.app" >&2
            find "$RUNNER_TEMP/mpv-extract" -maxdepth 4 -print | head -80
            exit 1
          fi
          cp -R "$MPV_APP" electron/mpv/darwin/mpv.app
          MPV_BIN="electron/mpv/darwin/mpv.app/Contents/MacOS/mpv"
          test -x "$MPV_BIN"
          lipo -archs "$MPV_BIN" | grep -F "$EXPECTED_ARCH"
          "$MPV_BIN" --version | head -3

      - name: Install dependencies on GitHub (not on your Mac)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix gui
          npm ci --prefix electron

      - name: Bundle macOS FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BIN="$(cd electron && node -p 'require("ffmpeg-static")')"
          test -x "$FFMPEG_BIN"
          mkdir -p electron/ffmpeg/darwin
          cp "$FFMPEG_BIN" electron/ffmpeg/darwin/ffmpeg
          chmod 755 electron/ffmpeg/darwin/ffmpeg
          electron/ffmpeg/darwin/ffmpeg -version | head -2

      - name: Create native Mac icon
        shell: bash
        run: |
          set -euo pipefail
          cd electron/assets
          mkdir -p strawverse.iconset
          for size in 16 32 128 256 512; do
            sips --setProperty format png --resampleHeightWidth "$size" "$size" \
              luffy.png --out "strawverse.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips --setProperty format png --resampleHeightWidth "$double" "$double" \
              luffy.png --out "strawverse.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil --convert icns strawverse.iconset --output strawverse.icns
          rm -rf strawverse.iconset

      - name: Build React interface
        run: npm run build --prefix gui

      - name: Package Mac .app, .dmg, and .zip
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          cd electron
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify bundled tools and installers
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find electron/dist -type d -name 'StrawVerse.app' -print -quit)"
          test -n "$APP"
          MPV="$APP/Contents/Resources/mpv/mpv.app/Contents/MacOS/mpv"
          FFMPEG="$APP/Contents/Resources/ffmpeg/ffmpeg"
          test -x "$MPV"
          test -x "$FFMPEG"
          "$MPV" --version | head -2
          "$FFMPEG" -version | head -2
          ls -lh electron/dist/*.dmg electron/dist/*.zip

      - name: Upload the finished macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-${{ matrix.label }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: error
          retention-days: 14
