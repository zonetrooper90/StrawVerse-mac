name: Gallery controlled checkpoint publisher

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/changes/pending/*.py'

permissions:
  contents: read

concurrency:
  group: gallery-approved-publish
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/gallery-candidate-tests.yml
    permissions:
      contents: read
    with:
      base: ${{ github.sha }}
      previous: ${{ github.event.before }}
  publish:
    needs: candidate
    outputs:
      published_sha: ${{ steps.published_commit.outputs.published_sha }}
    # Default success() semantics: never run after any failed, cancelled or skipped required job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out exact infrastructure commit and history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Create isolated request worktree
        env:
          BASE: ${{ github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/gallery-candidate" "$BASE"
      - name: Download tested candidate by artifact ID
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/gallery-patch
          digest-mismatch: error
      - name: Verify exact tested candidate and stage immutable checkpoint
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: ${{ github.sha }}
          TREE: ${{ needs.candidate.outputs.tree }}
          DIGEST: ${{ needs.candidate.outputs.sha256 }}
          REQUEST: ${{ needs.candidate.outputs.request }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$BASE"
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" restore --base "$BASE" --tree "$TREE" --sha256 "$DIGEST" --patch "$RUNNER_TEMP/gallery-patch/candidate.patch"
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" stage --base "$BASE" --tree "$TREE" --request "$REQUEST"
      - name: Commit tested source, generated HTML and checkpoint together
        id: published_commit
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(gallery): publish approved Gallery source change"
          git push origin HEAD:refs/heads/gallery/development-clean
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$(git rev-parse HEAD)"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Trigger independent read-only post-commit verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gallery-checkpoint-integrity.yml --ref gallery/development-clean
          gh workflow run gallery-transition-ui.yml --ref gallery/development-clean

  # BEGIN NONREQUIRED PUBLISHED-SHA SHADOW: advisory, never a release gate.
  shadow-preflight:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    outputs:
      verified: ${{ steps.advisory_guard.outcome }}
    name: Advisory exact published-SHA, immutable dual build and original test preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit and preserved ancestry
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish.outputs.published_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Guard exact post-push published target and original publisher source
        id: advisory_guard
        env:
          REQUEST_SHA: ${{ github.sha }}
          PUBLISHED_SHA: ${{ needs.publish.outputs.published_sha }}
        run: |
          set -euo pipefail
          python3 -B gallery/tests/test_publisher_shadow_contract.py
          python3 -B gallery/tools/published-shadow-target.py \
            --request "$REQUEST_SHA" --target "$PUBLISHED_SHA" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" --checkout .
      - name: Reject malformed coverage, promoted contracts and forged or incomplete proofs
        run: python3 -B gallery/tests/test_release_regression_shards.py
      - name: Verify exact HEAD, both deterministic HTML files, archive and unchanged original gates
        env:
          SHA: ${{ needs.publish.outputs.published_sha }}
        run: python3 -B gallery/tools/release-regression-shards.py --exact-commit "$SHA" --verify
      - name: Fail if any preflight tool changed the source checkout
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'PASS: dynamic read-only preflight. Existing mandatory regression/publisher remain unchanged.' >> "$GITHUB_STEP_SUMMARY"

  shadow-shards:
    continue-on-error: true
    if: ${{ needs.shadow-preflight.outputs.verified == 'success' }}
    name: Exact original ${{ matrix.mode }} / ${{ matrix.suite }}
    needs: [publish, shadow-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: full, suite: transitions }
          - { mode: full, suite: coordinated-fades }
          - { mode: full, suite: history-row-maintenance }
          - { mode: full, suite: player-settings-regression }
          - { mode: lightweight, suite: transitions }
          - { mode: lightweight, suite: coordinated-fades }
          - { mode: lightweight, suite: history-row-maintenance }
          - { mode: lightweight, suite: player-settings-regression }
          - { mode: both, suite: subtitle-preview-modes }
    steps:
      - name: Checkout original complete exact Git history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish.outputs.published_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Recheck dynamic original exact-build/checkpoint and original suites before Chromium
        env:
          SHA: ${{ needs.publish.outputs.published_sha }}
        run: python3 -B gallery/tools/release-regression-shards.py --exact-commit "$SHA" --verify
      - name: Install pinned original Chromium runner
        uses: ./.github/actions/gallery-browser
      - name: Run one complete unchanged original Python script in original HTML mode
        id: execution
        env:
          MODE: ${{ matrix.mode }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            transitions) script=gallery/tests/test_transitions.py ;;
            coordinated-fades) script=gallery/tests/test_coordinated_fades.py ;;
            history-row-maintenance) script=gallery/tests/test_history_row_maintenance.py ;;
            player-settings-regression) script=gallery/tests/test_player_settings_regression.py ;;
            subtitle-preview-modes) script=gallery/tests/test_asset_build_modes.py ;;
            *) echo 'Unrecognized test shard' >&2; exit 1 ;;
          esac
          case "$MODE" in
            full) test "$SUITE" != subtitle-preview-modes; html=gallery/Gallery-current.html ;;
            lightweight) test "$SUITE" != subtitle-preview-modes; html=gallery/Gallery-development.html ;;
            both) test "$SUITE" = subtitle-preview-modes; html= ;;
            *) echo 'Unrecognized HTML mode' >&2; exit 1 ;;
          esac
          start=$SECONDS
          if [ "$MODE" = both ]; then
            python3 "$script"
          else
            python3 "$script" "$html"
          fi
          echo "seconds=$((SECONDS-start))" >> "$GITHUB_OUTPUT"
      - name: Record passing script and exact source/build/checkpoint provenance
        env:
          SHA: ${{ needs.publish.outputs.published_sha }}
          MODE: ${{ matrix.mode }}
          SUITE: ${{ matrix.suite }}
          SECONDS_RESULT: ${{ steps.execution.outputs.seconds }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -B gallery/tools/release-regression-shards.py --exact-commit "$SHA" \
            --record --mode "$MODE" --suite "$SUITE" --seconds "$SECONDS_RESULT" \
            --run-id "$RUN" --run-attempt "$ATTEMPT" \
            --output "$RUNNER_TEMP/gallery-release-shard/$MODE-$SUITE.json"
          test -z "$(git status --porcelain)"
      - name: Publish short-lived proof artifact only, NOT HTML or release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gallery-publisher-shadow-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/gallery-release-shard/
          retention-days: 7
          if-no-files-found: error

  shadow-aggregate:
    continue-on-error: true
    name: Advisory nine-shard exact published proof - NOT a release gate
    needs: [publish, shadow-preflight, shadow-shards]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fail closed if ANY preflight or shard failed skipped or canceled
        env:
          PREFLIGHT: ${{ needs.shadow-preflight.outputs.verified }}
          SHARDS: ${{ needs.shadow-shards.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          test "$SHARDS" = success
      - name: Checkout exact source commit with full ancestry for independent validation
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish.outputs.published_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Retrieve nine successful proofs only from this run AND attempt
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: gallery-publisher-shadow-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/gallery-publisher-shadow-proofs/
          merge-multiple: true
      - name: Reverify dynamic build and all nine exact commit/test/proof identities
        env:
          SHA: ${{ needs.publish.outputs.published_sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -B gallery/tools/release-regression-shards.py --exact-commit "$SHA" \
            --aggregate "$RUNNER_TEMP/gallery-publisher-shadow-proofs" \
            --run-id "$RUN" --run-attempt "$ATTEMPT" \
            | tee "$RUNNER_TEMP/gallery-release-regression-summary.txt"
          cat "$RUNNER_TEMP/gallery-release-regression-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'ADVISORY on exact POST-PUSH published SHA, NOT a gate; both original independent release workflows stay mandatory.' >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain)"
  # END NONREQUIRED PUBLISHED-SHA SHADOW.
