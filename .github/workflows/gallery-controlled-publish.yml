name: Gallery controlled checkpoint publisher

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/changes/pending/*.py'

permissions:
  contents: read

concurrency:
  group: gallery-approved-publish
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/gallery-candidate-tests.yml
    permissions:
      contents: read
    with:
      base: ${{ github.sha }}
      previous: ${{ github.event.before }}
  publish:
    needs: candidate
    # Default success() semantics: never run after any failed, cancelled or skipped required job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out exact infrastructure commit and history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Create isolated request worktree
        env:
          BASE: ${{ github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/gallery-candidate" "$BASE"
      - name: Download tested candidate by artifact ID
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/gallery-patch
          digest-mismatch: error
      - name: Verify exact tested candidate and stage immutable checkpoint
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: ${{ github.sha }}
          TREE: ${{ needs.candidate.outputs.tree }}
          DIGEST: ${{ needs.candidate.outputs.sha256 }}
          REQUEST: ${{ needs.candidate.outputs.request }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$BASE"
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" restore --base "$BASE" --tree "$TREE" --sha256 "$DIGEST" --patch "$RUNNER_TEMP/gallery-patch/candidate.patch"
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" stage --base "$BASE" --tree "$TREE" --request "$REQUEST"
      - name: Commit tested source, generated HTML and checkpoint together
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(gallery): publish approved Gallery source change"
          git push origin HEAD:refs/heads/gallery/development-clean
          test "$(git ls-remote origin refs/heads/gallery/development-clean | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Trigger independent read-only post-commit verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gallery-checkpoint-integrity.yml --ref gallery/development-clean
          gh workflow run gallery-transition-ui.yml --ref gallery/development-clean
