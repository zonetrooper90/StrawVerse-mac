name: Gallery page-transition regression

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery-transition-ui.yml'
      - '.github/actions/gallery-browser/action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-routes:
    name: browser-routes (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: full
            html: gallery/Gallery-current.html
          - group: lightweight
            html: gallery/Gallery-development.html
          - group: subtitle-preview-modes
            html: ''
    steps:
      - name: Check out exact Gallery commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify checkpoint and canonical working file
        run: |
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('gallery/checkpoints/current.json').read_text())
          b=Path('gallery/Gallery-current.html').read_bytes()
          assert len(b)==p['bytes'] and hashlib.sha256(b).hexdigest()==p['sha256']
          PY
          python3 gallery/tools/build-gallery.py --check
      - name: Install pinned Chromium test runner
        uses: ./.github/actions/gallery-browser
      - name: Test navigation, coordinated fades, Watch History, Player and Settings
        if: matrix.group != 'subtitle-preview-modes'
        env:
          GALLERY_HTML: ${{ matrix.html }}
        run: |
          set -euo pipefail
          python3 gallery/tests/test_transitions.py "$GALLERY_HTML"
          python3 gallery/tests/test_coordinated_fades.py "$GALLERY_HTML"
          python3 gallery/tests/test_history_row_maintenance.py "$GALLERY_HTML"
          python3 gallery/tests/test_player_settings_regression.py "$GALLERY_HTML"
      - name: Test both subtitle preview asset modes and geometry parity
        if: matrix.group == 'subtitle-preview-modes'
        run: python3 gallery/tests/test_asset_build_modes.py
