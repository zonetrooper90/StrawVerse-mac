name: Diagnose MPV graphical startup on macOS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-macos-build
    paths:
      - ".github/workflows/diagnose-mpv-macos.yml"

permissions:
  contents: read

jobs:
  inspect-mpv:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download exact bundled MPV (Apple Silicon)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpv-diagnostics"
          curl -fsSL --retry 3 \
            https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-macos-14-arm.zip \
            -o "$RUNNER_TEMP/mpv.zip"
          unzip -q "$RUNNER_TEMP/mpv.zip" -d "$RUNNER_TEMP/mpv-diagnostics"
          tar -xzf "$RUNNER_TEMP/mpv-diagnostics/mpv.tar.gz" -C "$RUNNER_TEMP/mpv-diagnostics"
          MPV_APP="$(find "$RUNNER_TEMP/mpv-diagnostics" -type d -name mpv.app -print -quit)"
          test -d "$MPV_APP"
          cp -R "$MPV_APP" "$RUNNER_TEMP/original-mpv.app"
          echo "APP=$RUNNER_TEMP/original-mpv.app" >> "$GITHUB_ENV"

      - name: Inspect downloaded MPV code signing
        shell: bash
        run: |
          MPV="$APP/Contents/MacOS/mpv"
          file "$MPV"
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          codesign -dv --verbose=4 "$MPV" 2>&1 | head -50 || true
          codesign -d --entitlements - "$MPV" 2>&1 || true
          find "$APP/Contents" -type f -name '*.dylib' | head -20
          "$MPV" --version | head -10

      - name: Check interactive MPV launch before signing
        shell: bash
        run: |
          set -u
          MPV="$APP/Contents/MacOS/mpv"
          LOG="$RUNNER_TEMP/mpv-before.log"
          SOCK="$RUNNER_TEMP/mpv-before.sock"
          "$MPV" --no-config --idle=yes --force-window=yes \
            --input-ipc-server="$SOCK" --msg-level=all=info \
            >"$LOG" 2>&1 &
          PID=$!
          for i in 1 2 3 4 5 6 7 8; do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            if test -S "$SOCK"; then break; fi
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "Process alive; IPC socket exists? $(test -S "$SOCK" && echo yes || echo no)"
            kill -TERM "$PID" 2>/dev/null || true
          fi
          wait "$PID"; CODE=$?
          echo "Unmodified MPV exit status: $CODE"
          tail -80 "$LOG" || true
          exit 0

      - name: Compare ad-hoc hardened runtime signing
        shell: bash
        run: |
          set -u
          cp -R "$APP" "$RUNNER_TEMP/hardened-mpv.app"
          SIGNED="$RUNNER_TEMP/hardened-mpv.app"
          cat > "$RUNNER_TEMP/mpv-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.cs.disable-library-validation</key><true/>
          <key>com.apple.security.cs.allow-jit</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - --options runtime \
            --entitlements "$RUNNER_TEMP/mpv-entitlements.plist" \
            "$SIGNED" || true
          codesign --verify --deep --strict --verbose=2 "$SIGNED" || true
          codesign -d --entitlements - "$SIGNED/Contents/MacOS/mpv" 2>&1 || true
          MPV="$SIGNED/Contents/MacOS/mpv"
          LOG="$RUNNER_TEMP/mpv-after.log"
          SOCK="$RUNNER_TEMP/mpv-after.sock"
          "$MPV" --no-config --idle=yes --force-window=yes \
            --input-ipc-server="$SOCK" --msg-level=all=info \
            >"$LOG" 2>&1 &
          PID=$!
          for i in 1 2 3 4 5 6 7 8; do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            if test -S "$SOCK"; then break; fi
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "Process alive; IPC socket exists? $(test -S "$SOCK" && echo yes || echo no)"
            kill -TERM "$PID" 2>/dev/null || true
          fi
          wait "$PID"; CODE=$?
          echo "Hardened signed MPV exit status: $CODE"
          tail -80 "$LOG" || true
          echo "---- Recent macOS security messages ----"
          log show --last 3m --style compact \
            --predicate '(process == "amfid") OR (process == "taskgated")' 2>/dev/null | tail -50 || true
          exit 0
