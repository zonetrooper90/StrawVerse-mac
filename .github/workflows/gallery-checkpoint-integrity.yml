name: Gallery checkpoint integrity

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery-checkpoint-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed Gallery source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current HTML exactly matches immutable checkpoint
        run: |
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=json.loads(Path('gallery/checkpoints/current.json').read_text())
          html=Path('gallery/Gallery-current.html').read_bytes()
          assert len(html)==p['bytes'], 'Current HTML size differs from pointer'
          assert hashlib.sha256(html).hexdigest()==p['sha256'], 'Current HTML differs from immutable checkpoint'
          print('Working HTML matches verified immutable archive:',p['sha256'],len(html))
          PY
      - name: Restore immutable backup as recovery smoke test
        run: |
          python3 gallery/tools/restore-checkpoint.py --output "$RUNNER_TEMP/Gallery-recovered.html"
          cmp gallery/Gallery-current.html "$RUNNER_TEMP/Gallery-recovered.html"
      - name: Dry-run complete HTML editing and immutable checkpoint creation
        run: python3 gallery/tests/test_checkpoint_roundtrip.py
      - name: Verify deterministic Gallery asset build modes
        run: python3 gallery/tools/build-gallery.py --check
