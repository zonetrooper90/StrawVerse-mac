name: Gallery History episode visibility diagnostic
on:
  push:
    branches: ['gallery/development-clean']
    paths: ['gallery/audits/2026-11-16-history-episode-visibility-diagnostic.py']
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnose (${{ matrix.mode }}, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [full, lightweight]
        variant: [original, settled]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify exact immutable baseline and source assembly
        run: |
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 gallery/tools/build-gallery.py --check
      - uses: ./.github/actions/gallery-browser
      - name: Observe original and synchronized History route
        run: python3 -B gallery/audits/2026-11-16-history-episode-visibility-diagnostic.py "${{ matrix.mode }}" "${{ matrix.variant }}" "$RUNNER_TEMP/history-visibility.json"
      - name: Upload complete diagnostic traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-visibility-${{ matrix.mode }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/history-visibility.json
          if-no-files-found: error
      - name: Verify authoritative checkout unchanged
        if: always()
        run: test -z "$(git status --porcelain)"
