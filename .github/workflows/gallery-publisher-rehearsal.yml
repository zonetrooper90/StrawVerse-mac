name: Gallery parallel publisher read-only rehearsal

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - '.github/workflows/gallery-publisher-rehearsal.yml'
      - '.github/workflows/gallery-candidate-tests.yml'
      - 'gallery/tools/publisher-candidate.py'
      - 'gallery/tools/run-q2b1-comparison-shard.py'
      - 'gallery/tests/test_publisher_candidate_paths.py'

permissions:
  contents: read

jobs:
  candidate:
    uses: ./.github/workflows/gallery-candidate-tests.yml
    permissions:
      contents: read
    with:
      base: '2dfcb221e3e4e6af8a64703d51708ecf1818f298'
      previous: '99cadb3bbadf1d77aa82e9c2f319198bd415a8ac'
  verify-rehearsal:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact infrastructure commit and history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Create isolated request worktree
        env:
          BASE: '2dfcb221e3e4e6af8a64703d51708ecf1818f298'
        run: git worktree add --detach "$RUNNER_TEMP/gallery-candidate" "$BASE"
      - name: Download tested candidate by artifact ID
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/gallery-patch
          digest-mismatch: error
      - name: Reject tampered candidate, then verify exact tested bytes
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: '2dfcb221e3e4e6af8a64703d51708ecf1818f298'
          TREE: ${{ needs.candidate.outputs.tree }}
          DIGEST: ${{ needs.candidate.outputs.sha256 }}
          REQUEST: ${{ needs.candidate.outputs.request }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/gallery-patch/candidate.patch" "$RUNNER_TEMP/tampered.patch"
          printf 'tampered' >> "$RUNNER_TEMP/tampered.patch"
          if python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" restore --base "$BASE" --tree "$TREE" --sha256 "$DIGEST" --patch "$RUNNER_TEMP/tampered.patch"; then
            echo 'ERROR: modified artifact was accepted'
            exit 1
          fi
          test -z "$(git status --porcelain)"
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" restore --base "$BASE" --tree "$TREE" --sha256 "$DIGEST" --patch "$RUNNER_TEMP/gallery-patch/candidate.patch"
          if python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" verify --base "$BASE" --tree 0000000000000000000000000000000000000000; then
            echo 'ERROR: wrong candidate tree was accepted'
            exit 1
          fi
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" verify --base "$BASE" --tree "$TREE"
      - name: Stage archive only inside disposable historical worktree
        working-directory: ${{ runner.temp }}/gallery-candidate
        env:
          BASE: '2dfcb221e3e4e6af8a64703d51708ecf1818f298'
          TREE: ${{ needs.candidate.outputs.tree }}
          DIGEST: ${{ needs.candidate.outputs.sha256 }}
          REQUEST: ${{ needs.candidate.outputs.request }}
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/gallery/tools/publisher-candidate.py" stage --base "$BASE" --tree "$TREE" --request "$REQUEST"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('gallery/checkpoints/current.json').read_text())
          assert p['folder']=='2026-11-13-q2b1-downloads-declarations-retry'
          assert p['sha256']=='2c0dbfd0aa3ff31fd36d0f0b82ae3421351a128cd6e9c39f46fbde232d24d608'
          assert hashlib.sha256(Path('gallery/Gallery-development.html').read_bytes()).hexdigest()=='f9ca46ad2de6dfd320872b7aa529ef4b44ecfbc8507410e6dd1e9394636f2721'
          print('Rehearsal exactly reproduced accepted full/lightweight bytes and checkpoint identity.')
          PY
      - name: Prove authoritative checkout and branch were not changed
        run: |
          test -z "$(git status --porcelain)"
          python3 gallery/tools/restore-checkpoint.py --verify-only
          python3 gallery/tools/build-gallery.py --check
          echo 'Read-only rehearsal completed; no remote commit or checkpoint published.'
