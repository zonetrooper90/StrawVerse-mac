name: Gallery approved infrastructure audit queue

on:
  push:
    branches:
      - 'gallery/development-clean'
    paths:
      - 'gallery/queues/2026-11-13-infrastructure-audit.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: gallery-audit-queue-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verification-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact approved queue commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Require both independent checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 gallery/tools/gate-audit-queue.py gallery/queues/2026-11-13-infrastructure-audit.json

  read-only-audit:
    needs: verification-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Reconfirm read-only source integrity
        run: python3 gallery/tools/build-gallery.py --check
      - name: Install audit-only parser and browser
        run: |
          python -m pip install 'tinycss2==1.4.0' 'playwright==1.57.0'
          python -m playwright install chromium
      - name: Inventory design system and candidate override chains
        run: python3 gallery/tools/audit-design-system.py inventory --out "$RUNNER_TEMP/gallery-audit"
      - name: Investigate search syntax in isolated browser fixture
        run: python3 gallery/tools/audit-design-system.py anomaly --out "$RUNNER_TEMP/gallery-audit"
      - name: Ensure audit did not change repository files
        run: test -z "$(git status --porcelain)"
      - name: Preserve read-only evidence for discussion
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gallery-design-audit-${{ github.sha }}
          path: ${{ runner.temp }}/gallery-audit/
          if-no-files-found: error
          retention-days: 30
