<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src file: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Gallery — Soft Futuristic — Secondary Page Navigation</title><style>__GALLERY_STYLE_BLOCK__</style></head><body data-theme="ocean">
<div class="app" aria-label="Gallery for macOS preview">
  <header class="top">
    <div class="brand-row">
      <div class="brand"><span class="brandmark" id="brand-icon"></span><span class="brandname">Gallery</span><span class="subtitle">Apple Silicon · v0.2.7</span></div>
      <div class="toolbar">
        <div class="header-search" id="header-search">
          <button class="iconbtn header-search-trigger" id="search" type="button" aria-label="Search anime" aria-expanded="false" aria-controls="header-search-field" title="Search anime"></button>
          <div class="header-search-field" id="header-search-field" aria-hidden="true" inert>
            <label class="only-sr" for="header-search-input">Search anime</label>
            <input id="header-search-input" type="search" placeholder="Search anime…" autocomplete="off" maxlength="100" spellcheck="false">
            <button class="header-search-control" type="button" id="header-search-clear" aria-label="Clear search" title="Clear search" hidden></button>
            <button class="header-search-control header-search-close" type="button" id="header-search-close" aria-label="Close search" title="Close search"></button>
          </div>

        </div>
        <button class="iconbtn" id="settings" aria-label="Open settings" title="Settings" aria-expanded="false" aria-controls="settings-page"></button>
      </div>
    </div>
    <nav class="tabs" aria-label="Main navigation">
      <button type="button" class="tab active" id="nav-discover" data-view="discover" aria-current="page"></button>
      <button type="button" class="tab" id="nav-library" data-view="library"></button>
      <button type="button" class="tab" id="nav-downloads" data-view="downloads"></button>
    </nav>
  </header>
  <main class="workspace" id="workspace" tabindex="-1">
 <div id="tab-pages-viewport" class="tab-pages-viewport" hidden>
  <div id="tab-pages-track" class="tab-pages-track">
   <section class="tab-page" data-tab-page="discover" aria-label="Discover content"><div class="tab-page-content"></div></section>
   <section class="tab-page" data-tab-page="library" aria-label="Library content"><div class="tab-page-content"></div></section>
   <section class="tab-page" data-tab-page="downloads" aria-label="Downloads content"><div class="tab-page-content"></div></section>
  </div>
 </div>
 <div id="screen"></div>
 <section id="settings-page" class="settings-page" aria-label="Settings" hidden></section>
</main>
 <div id="tab-scroll-overlay" class="tab-scroll-overlay" aria-hidden="true"><div class="tab-scroll-thumb"></div></div>
</div>
<div id="modal-host"></div>
<script>__GALLERY_SCRIPT_BLOCK__</script></body></html>
