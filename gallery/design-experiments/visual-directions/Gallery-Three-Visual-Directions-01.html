const icon=(n,size=20)=>`<svg class="glyph s-${size}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.arrow}</svg>`;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const S={concept:'cinematic',view:'discover',search:false,query:'',modal:null,saved:new Set(['solo','moon','paper']),history:false};
const getShow=id=>shows.find(s=>s.id===id)||shows[0];
function art(s,extra=''){return `<div class="art ${extra}" data-kind="${s.kind}" style="--art:${s.grad}"><span class="art-stars"></span><span class="art-disc"></span><span class="art-curve"></span><div class="art-overprint"><strong>${esc(s.title)}</strong><small>G · ${s.num}</small></div></div>`;}
function btnNav(t,type){return `<button type="button" class="${S.view===t?'active':''}" data-action="nav" data-view="${t}" aria-current="${S.view===t?'page':'false'}">${type==='f'?icon(t,16):''}${t==='discover'?'Discover':t==='library'?'Library':'Downloads'}</button>`;}
function searchField(){return S.search?`<label class="search-inline">${icon('search',16)}<input id="quick-search" type="search" placeholder="Search titles in this concept…" value="${esc(S.query)}" aria-label="Search shows" autocomplete="off"><button type="button" data-action="search-close" aria-label="Close search">${icon('close',16)}</button></label>`:'';}
function listFiltered(){return shows.filter(x=>(S.view==='library'?S.saved.has(x.id):true)&&x.title.toLowerCase().includes(S.query.toLowerCase()));}
function renderedCard(s,kind,index){if(kind==='c')return `<button type="button" data-action="detail" data-id="${s.id}" class="c-card"><span>${art(s)}</span><h3>${esc(s.title)}</h3><small>${s.episodes} episodes · ${s.status}</small></button>`; if(kind==='e')return `<button type="button" data-action="detail" data-id="${s.id}" class="e-card"><span>${art(s)}</span><span class="no">${String(index+1).padStart(2,'0')} / ANIME</span><h3>${esc(s.title)}</h3><p>${esc(s.tags)}</p></button>`;return `<button type="button" data-action="detail" data-id="${s.id}" class="f-card press">${art(s)}<h3>${esc(s.title)}</h3><small>${esc(s.tags)}</small></button>`;}
function historyContent(kind){if(kind==='c')return `<div class="c-history"><span class="c-number">↗</span><div><h3>Continue your journey · Solo Leveling</h3><small>Episode 04 · 18 minutes remaining</small></div><span class="timeline" aria-hidden="true"></span><button class="c-secondary" type="button" data-action="history">${S.history?'Hide history':'Watch history'} ${icon('arrow',14)}</button></div>`;if(kind==='e')return `<div class="e-history"><h3>Previously, on Gallery</h3><div class="item"><span class="e-label">Now watching</span><div style="flex:1"><strong style="font-size:12px">Solo Leveling · Episode 04</strong><small>18 minutes remaining</small><div class="line"></div></div><button class="e-button alt" data-action="history" type="button">${S.history?'Close':'History'} ${icon('arrow',14)}</button></div></div>`;return `<div class="f-history"><div class="spot">✦</div><div><h3>Pick up where you left off</h3><small>Solo Leveling · Episode 04 · 18 min left</small></div><button type="button" class="f-link" data-action="history">${S.history?'Close history':'Your history'} ${icon('arrow',14)}</button></div>`;}
function extraHistory(){return S.history?`<div style="margin:15px 0" class="history-list"><div class="history-mini">${icon('play',14)} Solo Leveling · Episode 04</div><div class="history-mini">${icon('play',14)} Moonlit Signals · Episode 03</div><div class="history-mini">${icon('play',14)} Paper Crane Days · Episode 08</div></div>`:'';}
function cHeader(){return `<header class="c-header"><button type="button" class="bare c-logo" data-action="nav" data-view="discover" aria-label="Gallery home"><i></i> GALLERY</button><nav class="c-nav" aria-label="Main navigation">${allTabs.map(t=>btnNav(t,'c')).join('')}</nav><div class="c-actions"><button class="c-icon icon-control" type="button" aria-label="Search" data-action="search">${icon('search')}</button><button class="c-icon icon-control" type="button" aria-label="About this concept" data-action="about">${icon('settings')}</button></div></header>`;}
function eHeader(){return `<header class="e-head"><div class="issue">The anime index<br>Volume 01 / 2026</div><button type="button" class="bare e-logo" data-action="nav" data-view="discover">Gallery<em>.</em></button><div class="e-actions"><button class="e-square" type="button" aria-label="Search" data-action="search">${icon('search',20)}</button><button class="e-square" type="button" aria-label="About this concept" data-action="about">${icon('settings',20)}</button></div></header><nav class="e-nav" aria-label="Main navigation">${allTabs.map(t=>btnNav(t,'e')).join('')}</nav>`;}
function fHeader(){return `<header class="f-head"><button type="button" class="bare f-logo" data-action="nav" data-view="discover"><span class="f-orb-mark"></span><b>gallery</b></button><nav class="f-nav" aria-label="Main navigation">${allTabs.map(t=>btnNav(t,'f')).join('')}</nav><div class="f-actions"><button class="f-circle" type="button" aria-label="Search" data-action="search">${icon('search',20)}</button><button class="f-circle" type="button" aria-label="About this concept" data-action="about">${icon('settings',20)}</button></div></header>`;}
const featured=shows[0];
function cDiscover(){const list=listFiltered().filter(s=>s.id!=='moon').slice(0,5);return `<div class="c-main app-view">${searchField()}<div class="c-mast"><span>Now in focus</span><span class="rule"></span><span>Curated to explore</span><span>01 / 03</span></div><article class="c-feature">${art(featured)}<div class="c-feature-copy"><div class="series">FEATURE PRESENTATION · 01</div><h1>Moonlit<br>Signals</h1><p>${esc(featured.blurb)}</p><div class="c-cta"><button class="c-primary press" type="button" data-action="play" data-id="moon">${icon('play',16)} Watch now</button><button class="c-secondary press" type="button" data-action="detail" data-id="moon">Explore series ${icon('arrow',16)}</button></div></div><div class="c-feature-index">01 <span></span> 03</div></article><section class="c-section"><div class="c-section-head"><div><div class="section-num">CONTINUE EXPLORING · 02</div><h2>Stories waiting for you</h2></div><button class="c-link" data-action="nav" data-view="library">See your library ${icon('arrow',14)}</button></div><div class="c-cards">${list.map((s,i)=>renderedCard(s,'c',i)).join('')}</div></section>${historyContent('c')}${extraHistory()}</div>`;}
function eDiscover(){const list=listFiltered().filter(s=>s.id!=='moon').slice(0,4);return `<div class="e-body app-view">${searchField()}<div class="e-mast"><span>Issue No. 01 — Curated stories</span><span>Gallery / Stories for every mood</span><span>05 Nov 2026</span></div><div class="e-headerline"><h1>Discover<span style="color:var(--accent)">.</span></h1><div class="preface">A collection of stories worth staying up for. Browse what's new and find something entirely yours.</div></div><article class="e-feature">${art(featured)}<div class="e-feature-copy"><span class="e-label">Cover story / Number 01</span><h2>Moonlit<br>Signals</h2><p>${esc(featured.blurb)}</p><div class="e-feature-facts"><span>12 Episodes</span><span>Completed</span><span>Sci-fi / Drama</span></div><div class="sub-actions" style="margin-top:0"><button class="e-button press" type="button" data-action="detail" data-id="moon">Read the story ${icon('arrow',16)}</button><button class="e-button alt press" type="button" data-action="play" data-id="moon">${icon('play',16)} Play</button></div></div></article><section><div class="e-grid-head"><h2>Inside the collection</h2><div class="num">02—05 / Selected titles</div></div><div class="e-cards">${list.map((s,i)=>renderedCard(s,'e',i)).join('')}</div></section>${historyContent('e')}${extraHistory()}</div>`;}
function fDiscover(){const list=listFiltered().filter(s=>s.id!=='moon').slice(0,4);return `<div class="f-body app-view">${searchField()}<div class="f-greeting"><div><div class="kicker">A world of stories</div><h1>Find your <em>next</em> favorite.</h1></div><p>Make room for one more episode.</p></div><article class="f-feature"><div class="f-feature-copy"><span class="f-label">Orbit 01 · Featured story</span><h2>Moonlit<br>Signals</h2><p>${esc(featured.blurb)}</p><div class="f-cta"><button type="button" class="f-primary press" data-action="play" data-id="moon">${icon('play',16)} Start watching</button><button type="button" class="f-second press" data-action="detail" data-id="moon">Explore ${icon('arrow',16)}</button></div></div><div class="f-art">${art(featured)}<span class="satellite one"><small>Discovery no.</small><strong>001 / ∞</strong></span><span class="satellite two"><small>Currently in orbit</small><strong>Sci-fi · Drama</strong></span></div></article><section class="f-section"><div class="f-section-head"><h2>Explore the universe <span>✦ 04</span></h2><button type="button" class="f-link" data-action="nav" data-view="library">Your collection ${icon('arrow',14)}</button></div><div class="f-cards">${list.map((s,i)=>renderedCard(s,'f',i)).join('')}</div></section>${historyContent('f')}${extraHistory()}</div>`;}
function subView(){const base=S.concept, name=S.view==='library'?'Your Library':'Downloads', label=S.view==='library'?'Your personal collection':'Your offline episodes', cols=listFiltered(), saved=S.view==='library';const shell=base==='cinematic'?'c-sub':base==='editorial'?'e-sub':'f-sub';let content=`<div class="${shell} app-view"><div class="overline" style="color:var(--accent);margin-bottom:9px">${base==='editorial'?'From the archives':'Gallery collection'}</div><h1>${name}${base==='editorial'?'.':''}</h1><p class="tagline">${saved?'Keep every story you love in one place.':'Your downloads would appear here in the full Gallery app.'} This is a visual design study, so no files are transferred.</p>${searchField()}<div class="sub-actions"><button type="button" class="action-default" data-action="nav" data-view="discover">${icon('back',14)} Back to Discover</button>${saved?'':'<button type="button" class="action-light" data-action="nav" data-view="library">View your library</button>'}</div>`;if(saved)content+=cols.length?`<div class="sub-grid">${cols.map(s=>`<button type="button" class="sub-card press" data-action="detail" data-id="${s.id}">${art(s)}<h3>${esc(s.title)}</h3><p>${s.episodes} episodes · ${s.status}</p></button>`).join('')}</div>`:'<div class="empty-message">Nothing matches the current search.</div>';else content+=`<div class="empty-message">No downloads in this design study. The real Gallery download system remains in v103.</div>`;return content+'</div>';}
function searchResults(){const base=S.concept,shell=base==='cinematic'?'c-sub':base==='editorial'?'e-sub':'f-sub';const list=listFiltered();return `<div class="${shell} app-view">${searchField()}<div class="overline" style="color:var(--accent);margin:20px 0 9px">Search / Discover</div><h1>${base==='editorial'?'Found.':'Search results'}</h1><p>${list.length} title${list.length===1?'':'s'} matching “${esc(S.query)}”.</p>${list.length?`<div class="sub-grid">${list.map(s=>`<button type="button" class="sub-card press" data-action="detail" data-id="${s.id}">${art(s)}<h3>${esc(s.title)}</h3><p>${s.episodes} episodes · ${esc(s.tags)}</p></button>`).join('')}</div>`:'<div class="empty-message">No titles match your search.</div>'}</div>`;}
function modal(){if(!S.modal)return '';if(S.modal.type==='detail'){const s=getShow(S.modal.id);return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="${esc(s.title)} details"><button class="modal-close" type="button" aria-label="Close details" data-action="close">${icon('close',17)}</button><div class="modal-top">${art(s,'modal-art')}<div class="modal-details"><span class="meta">Series • ${s.status}</span><h2>${esc(s.title)}</h2><p>${esc(s.blurb)}</p><p>${s.episodes} episodes · ${esc(s.tags)}</p><div class="modal-actions"><button type="button" class="action-default" data-action="play" data-id="${s.id}">${icon('play',14)} Play preview</button><button type="button" class="action-light" data-action="save" data-id="${s.id}">${icon(S.saved.has(s.id)?'check':'plus',14)} ${S.saved.has(s.id)?'In Library':'Add to Library'}</button></div></div></div></section></div>`;}if(S.modal.type==='play'){const s=getShow(S.modal.id);return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="Playback concept"><button class="modal-close" type="button" aria-label="Close playback preview" data-action="close">${icon('close',17)}</button><div class="player-demo" style="background:${s.grad}"><div class="halo">${icon('play',32)}</div><div class="player-bottom"><span>02:41</span><span class="line"></span><span>24:30</span></div></div><div class="modal-intro"><h2>${esc(s.title)}</h2><p>Playback is only represented visually in this design concept. The real player and Watch History behavior remain in stable Gallery v103.</p><div class="modal-actions"><button type="button" class="action-default" data-action="close">Return to Discover</button></div></div></section></div>`;}return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="About this concept"><button class="modal-close" type="button" aria-label="Close" data-action="close">${icon('close',17)}</button><div class="modal-intro" style="padding:39px 36px"><span class="overline" style="color:var(--accent)">Gallery · Design Study 01</span><h2 style="font-size:29px;margin:15px 0">${S.concept==='cinematic'?'Cinematic':S.concept==='editorial'?'Editorial':'Soft Futuristic'}</h2><p>${notes[S.concept].replace(/<[^>]*>/g,'')}</p><p style="margin-top:18px">Try Discover, Library, details, Search and Watch History. These are simplified interactive concepts rather than alternate builds of Gallery. No external resources, artwork downloads, or persistent app settings are used.</p><div class="modal-actions"><button class="action-default" type="button" data-action="close">Continue exploring</button></div></div></section></div>`;}
function render(keepScroll=false){const host=$('#canvas'), previous=keepScroll?$('.app-content')?.scrollTop:0;let html;const searchOnDiscover=S.view==='discover'&&S.search&&S.query.trim();const content=searchOnDiscover?searchResults():S.view!=='discover'?subView():S.concept==='cinematic'?cDiscover():S.concept==='editorial'?eDiscover():fDiscover();if(S.concept==='cinematic'){html=`<section class="design cinematic" aria-label="Cinematic Gallery concept">${cHeader()}<div class="app-content">${content}</div>${modal()}</section>`;}else if(S.concept==='editorial'){html=`<section class="design editorial" aria-label="Editorial Gallery concept">${eHeader()}<div class="app-content">${content}</div>${modal()}</section>`;}else{html=`<section class="design futuristic" aria-label="Soft Futuristic Gallery concept">${fHeader()}<div class="app-content">${content}</div>${modal()}</section>`;}host.innerHTML=html;for(const b of document.querySelectorAll('[data-concept]'))b.setAttribute('aria-pressed',String(b.dataset.concept===S.concept));$('#concept-note').innerHTML=notes[S.concept];if(keepScroll&&$('.app-content'))$('.app-content').scrollTop=previous;if(S.modal){document.body.classList.add('lock');$('.modal-close')?.focus({preventScroll:true});}else document.body.classList.remove('lock');}
function setConcept(id){if(!notes[id]||id===S.concept)return;S.concept=id;S.view='discover';S.search=false;S.query='';S.modal=null;S.history=false;render();}
document.addEventListener('click',e=>{const concept=e.target.closest('[data-concept]');if(concept){setConcept(concept.dataset.concept);return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='close-backdrop'){if(e.target===el){S.modal=null;render(true);}return;}if(a==='nav'){S.view=el.dataset.view;S.search=false;S.query='';S.modal=null;S.history=false;render();return;}if(a==='search'){S.search=!S.search;S.query='';render(true);if(S.search)$('#quick-search')?.focus();return;}if(a==='search-close'){S.search=false;S.query='';render(true);return;}if(a==='detail'){S.modal={type:'detail',id:el.dataset.id};render(true);return;}if(a==='play'){S.modal={type:'play',id:el.dataset.id};render(true);return;}if(a==='about'){S.modal={type:'about'};render(true);return;}if(a==='history'){S.history=!S.history;render(true);return;}if(a==='save'){const id=el.dataset.id;if(S.saved.has(id))S.saved.delete(id);else S.saved.add(id);render(true);return;}if(a==='close'){S.modal=null;render(true);return;}});
document.addEventListener('input',e=>{if(e.target?.id!=='quick-search')return;const input=e.target, value=input.value, pos=input.selectionStart;S.query=value;render(true);const fresh=$('#quick-search');if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos);}catch{}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render(true);}else if(S.search){S.search=false;S.query='';render(true);}return;}if((e.key==='ArrowLeft'||e.key==='ArrowRight')&& !S.modal&& !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();const keys=Object.keys(notes);const index=keys.indexOf(S.concept);setConcept(keys[(index+(e.key==='ArrowRight'?1:keys.length-1))%keys.length]);}});
render();
})();
</script>
</body>
</html>
