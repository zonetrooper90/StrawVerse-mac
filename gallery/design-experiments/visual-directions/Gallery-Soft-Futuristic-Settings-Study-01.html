body{background:radial-gradient(ellipse at top,var(--shell-panel),transparent 58%),linear-gradient(180deg,#0a1014,#070b0e)}
.study-shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:14px;padding:14px}
.study-top,.study-bottom{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border:1px solid var(--shell-border);background:var(--shell-panel);border-radius:18px;color:var(--shell-text)}
.study-left{display:flex;align-items:center;gap:12px;min-width:0}.study-left strong{display:block;font-size:15px}.study-left small{display:block;color:var(--shell-muted);font-size:12px;margin-top:3px}
.palette-switch{min-width:0;max-width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.palette-switch button{border:1px solid var(--shell-border);background:#ffffff06;color:var(--shell-text);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:650;display:flex;align-items:center;gap:9px}.palette-switch button[aria-pressed="true"]{background:#ffffff14;outline:1px solid #ffffff22}.swatch{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px #0005 inset,0 0 0 1px #fff2}.swatch.ocean{background:linear-gradient(135deg,#294951,#a0f1d6)}.swatch.twilight{background:linear-gradient(135deg,#38345e,#c8bcff)}.swatch.ember{background:linear-gradient(135deg,#573238,#f0c0ab)}.swatch.slate{background:linear-gradient(135deg,#43505a,#c7d2da)}.swatch.glacier{background:linear-gradient(135deg,#5c7489,#f4fbff)}.swatch.verdant{background:linear-gradient(135deg,#335542,#c3efd0)}
#canvas{min-width:0;min-height:0;max-width:1680px;width:100%;margin:0 auto;padding:26px clamp(12px,3.2vw,46px) 0}.study-bottom{font-size:12px;color:var(--shell-muted)}.study-bottom strong{color:var(--shell-text)}
/* Shared pieces from the original concept */
.design{height:100%;border:1px solid #ffffff0d;overflow:hidden;position:relative}.design button{color:inherit}.bare{border:0;background:none;color:inherit;padding:0;font:inherit;text-align:left}.glyph{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}.press{transition:transform .22s ease,filter .22s ease,background .22s ease,box-shadow .22s ease}.press:hover{transform:translateY(-2px)}
.app-content{height:calc(100% - 90px);overflow:auto;scrollbar-width:none}.app-content::-webkit-scrollbar{display:none}
.search-inline{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:100px;padding:11px 13px;max-width:520px;box-shadow:inset 0 1px 0 #fff1;margin-bottom:18px}.search-inline input{background:transparent;border:0;outline:none;color:var(--fg);min-width:0;flex:1}.search-inline button{border:0;background:transparent;color:var(--muted);padding:0}.search-inline input::placeholder{color:var(--muted)}
.overline{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:760}.tagline{max-width:60ch}.empty-message{padding:18px 20px;border:1px dashed var(--line);border-radius:20px;margin-top:22px;color:var(--muted);background:#ffffff05}.history-list{display:grid;gap:9px}.history-mini{display:flex;align-items:center;gap:10px;font-size:12px;padding:10px 12px;border-radius:14px;background:#ffffff08;border:1px solid var(--line)}
/* Shared art from the original study */
.art{position:relative;background:var(--art);overflow:hidden;isolation:isolate}.art:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff18,transparent 38%,#00000024)}.art-stars{position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,#fff7 0 1px,transparent 1.5px),radial-gradient(circle at 75% 28%,#fff8 0 1px,transparent 1.5px),radial-gradient(circle at 60% 72%,#fff6 0 1px,transparent 1.5px),radial-gradient(circle at 33% 56%,#fff5 0 1px,transparent 1.5px)}
.art-disc{position:absolute;border:2px solid #ffffff6e;border-radius:50%;aspect-ratio:1;width:59%;left:35%;top:12%;transform:rotate(-17deg)}.art-disc:before{content:"";position:absolute;inset:18%;border:1.5px solid #ffffff59;border-radius:50%}.art-curve{position:absolute;inset:auto -10% -17% -10%;height:40%;border-radius:50%;border:4px solid #ffffff5e;transform:rotate(-9deg)}.art-overprint{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:end;color:#fff}.art-overprint strong{font-size:24px;line-height:1;letter-spacing:-.06em;max-width:80%}.art-overprint small{font-size:11px;opacity:.9;letter-spacing:.12em}.art[data-kind="paper"] .art-disc{border-radius:6px;transform:rotate(18deg);width:55%;left:45%;top:5%}.art[data-kind="harbor"] .art-disc{left:45%;top:36%;width:50%}.art[data-kind="neon"] .art-disc{border-radius:45px;transform:rotate(37deg);width:56%;left:35%;top:13%}.art[data-kind="orchard"] .art-disc{left:10%;top:-2%;width:56%}.art[data-kind="solo"] .art-disc{left:52%;top:24%;width:56%}.art[data-kind="quints"] .art-disc{width:70%;left:42%;top:27%}.art[data-kind="astral"] .art-disc{width:50%;left:25%;top:12%}
/* Locked original Soft Futuristic concept */
.futuristic{border-radius:28px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 92% 12%,var(--backdrop-a),transparent 40%),radial-gradient(ellipse at 15% 80%,var(--backdrop-b),transparent 45%),var(--bg);color:var(--fg)}
.f-head{height:90px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,3.3vw,53px);gap:20px;position:relative;z-index:5}.f-logo{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:690;letter-spacing:-.07em}.f-logo b{font-weight:690}.f-orb-mark{width:35px;height:35px;border:3px solid var(--orb);border-radius:50%;position:relative;transform:rotate(-38deg)}.f-orb-mark:before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--orb)}.f-orb-mark:after{content:"";position:absolute;width:16px;height:7px;background:var(--bg);top:-7px;left:9px}.f-nav{display:flex;padding:5px;align-items:center;gap:3px;border-radius:100px;border:1px solid var(--nav-border);background:var(--nav-bg);box-shadow:inset 0 2px 8px #0005,0 8px 30px #0002}.f-nav button{border:0;border-radius:100px;background:transparent;color:var(--muted);font-size:12px;letter-spacing:.01em;font-weight:710;padding:12px 19px;display:flex;align-items:center;gap:8px;transition:background .28s,box-shadow .28s,transform .28s,color .28s}.f-nav button.active{background:linear-gradient(170deg,var(--nav-active-a),var(--nav-active-b));color:var(--nav-active-text);box-shadow:inset 0 1px 1px #fff8,0 3px 9px #0004}.f-nav button:hover:not(.active){background:var(--nav-hover);color:white}.f-actions{display:flex;align-items:center;gap:11px}.f-circle{width:41px;height:41px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--circle-border);background:var(--circle-bg);box-shadow:inset 0 1px 2px #ffffff18,0 4px 14px #0003}.f-circle:hover{background:var(--circle-hover)}.f-body{padding:9px clamp(20px,3.3vw,53px) 50px}.f-greeting{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:16px 0 24px}.f-greeting .kicker{display:flex;align-items:center;gap:8px;color:var(--kicker);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.f-greeting .kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kicker-dot);box-shadow:0 0 0 5px var(--kicker-ring)}.f-greeting h1{margin:8px 0 0;font-size:clamp(37px,4.5vw,63px);font-weight:630;letter-spacing:-.075em;line-height:1}.f-greeting h1 em{font-style:normal;color:var(--hero-em)}.f-greeting p{font-size:12px;color:var(--muted);margin:0 0 4px}

@media(max-width:760px){.sf-settings-head{gap:8px}.sf-settings-brand .sf-head-divider,.sf-settings-brand .sf-head-label{display:none}.sf-settings-head .f-logo{width:auto}.sf-settings-shell{padding:10px 18px 36px}.sf-settings-intro{align-items:start;flex-direction:column;gap:10px;margin-bottom:20px}.sf-settings-layout{grid-template-columns:minmax(0,1fr);gap:18px}.sf-side{position:relative;top:auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:20px}.sf-side-caption{display:none}.sf-side button{padding:11px 12px;gap:7px;font-size:11px;flex:none}.sf-side button .sf-arrow{display:none}.sf-panel-title h2{font-size:27px}.sf-panel-count{display:none}.sf-font-choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.sf-back{padding:10px 12px;font-size:11px}.sf-back svg{width:15px}.sf-settings-head{padding:13px 16px}.sf-settings-head .f-orb-mark{height:27px;width:27px}.sf-settings-head .f-logo{font-size:21px}.sf-side button{padding:9px 10px}.sf-side button svg{width:14px;height:14px}.sf-theme-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.sf-theme-art{height:66px}.sf-card{padding:16px;border-radius:20px}.sf-field-row{gap:10px;align-items:flex-start;flex-direction:column}.sf-select{width:100%}.sf-field-row.sf-row-switch{flex-direction:row;align-items:center}.sf-subtabs{width:100%;justify-content:space-between}.sf-subtabs button{padding:10px 11px;font-size:11px}.sf-font-choices{grid-template-columns:1fr}.sf-font-tile{padding:14px}.sf-font-sample{font-size:30px;margin-bottom:8px}.sf-preview-box{padding:14px 10px 23px}.sf-source{flex-wrap:wrap}.sf-source-btn{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.sf-settings-panel{animation:none}.sf-side button,.sf-switch:before,.sf-theme-tile,.sf-back{transition:none}}

<body data-palette="ocean">
<div class="study-shell">
  <header class="study-top">
    <div class="study-left">
      <div>
        <strong>Gallery · Soft Futuristic · Settings study 01</strong>
        <small>Six curated themes · explore the full Settings interface</small>
      </div>
    </div>
    <div class="palette-switch" role="group" aria-label="Choose a palette">
      <button type="button" data-palette="ocean" aria-pressed="true"><span class="swatch ocean"></span>Ocean</button>
      <button type="button" data-palette="twilight" aria-pressed="false"><span class="swatch twilight"></span>Twilight</button>
      <button type="button" data-palette="ember" aria-pressed="false"><span class="swatch ember"></span>Ember</button>
      <button type="button" data-palette="slate" aria-pressed="false"><span class="swatch slate"></span>Slate</button>
      <button type="button" data-palette="glacier" aria-pressed="false"><span class="swatch glacier"></span>Glacier</button>
      <button type="button" data-palette="verdant" aria-pressed="false"><span class="swatch verdant"></span>Verdant</button>
    </div>
  </header>
  <main id="canvas"></main>
  <footer class="study-bottom"><div><strong>Design study:</strong> Settings adapts the real v103 section structure. All preference changes stay in this HTML preview.</div><div>Stable Gallery v103 unchanged</div></footer>
</div>
<script>
(()=>{'use strict';
const $=(q,el=document)=>el.querySelector(q);
const shows=[
{id:'moon',title:'Moonlit Signals',kind:'moon',grad:'linear-gradient(145deg,#322554 2%,#74548f 51%,#c48b9c 100%)',num:'01',episodes:12,status:'Completed',tags:'Sci-fi · Drama',blurb:'A quiet science-fiction story about late-night messages between distant worlds.'},
{id:'astra',title:'Astra Afterlight',kind:'astral',grad:'linear-gradient(145deg,#213654,#386e88 50%,#88c2c1 100%)',num:'02',episodes:12,status:'Ongoing',tags:'Mystery · Adventure',blurb:'An observatory apprentice follows a mysterious new constellation.'},
{id:'paper',title:'Paper Crane Days',kind:'paper',grad:'linear-gradient(150deg,#513a60,#a57696 52%,#f4b6a1)',num:'03',episodes:10,status:'Completed',tags:'Slice of life',blurb:'A charming slice-of-life story about a neighborhood stationery shop.'},
{id:'harbor',title:'The Glass Harbor',kind:'harbor',grad:'linear-gradient(160deg,#233955,#4b6384 52%,#b8b3ca)',num:'04',episodes:13,status:'Completed',tags:'Mystery · Drama',blurb:'A coastal town reveals its secrets whenever the tide retreats.'},
{id:'orchard',title:'Golden Orchard',kind:'orchard',grad:'linear-gradient(165deg,#75506b,#aa796d 55%,#f5bf80)',num:'05',episodes:24,status:'Ongoing',tags:'Drama · Friendship',blurb:'Old friends reunite to save an orchard with an unusual history.'},
{id:'neon',title:'Neon Reverie',kind:'neon',grad:'linear-gradient(135deg,#252a5b,#7b57a3 55%,#d277ac)',num:'06',episodes:12,status:'Completed',tags:'Adventure',blurb:'A nighttime city adventure where every streetlight remembers a wish.'},
{id:'solo',title:'Solo Leveling',kind:'solo',grad:'linear-gradient(150deg,#121a35,#415078 50%,#8b6ab1)',num:'07',episodes:12,status:'Completed',tags:'Action',blurb:'A hunter gains an unusual ability after a dangerous dungeon encounter.'},
{id:'quints',title:'The Quintessential Quintuplets',kind:'quints',grad:'linear-gradient(152deg,#3c425f 0%,#806c98 42%,#c68d9d 73%,#e8baab 100%)',num:'08',episodes:12,status:'Completed',tags:'Comedy · Romance',blurb:'Futaro Uesugi becomes tutor to five identical sisters with very different personalities.'}
];
const allTabs=['discover','library','downloads'];
const note='Soft Futuristic — tactile, sculpted matte surfaces, orbit motifs, floating controls, and gentle energy. Palette only: Ocean, Twilight, Ember, Slate, Glacier, and Verdant.';
const icons={search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',play:'<path d="m8 5 11 7-11 7z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',discover:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/>',library:'<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5h4v15h-4z"/>',downloads:'<path d="M12 3v12m-4-4 4 4 4-4M4 18v3h16v-3"/>',check:'<path d="m4 12 5 5L20 6"/>',back:'<path d="m15 18-6-6 6-6"/>',palette:'<path d="M12 3a9 9 0 0 0-9 9c0 5 4 9 9 9h1.2a2.8 2.8 0 0 0 2.1-4.7 2 2 0 0 1 1.5-3.3H18a3 3 0 0 0 3-3 9 9 0 0 0-9-7z"/><circle cx="7.5" cy="12.5" r=".8"/><circle cx="10" cy="7.7" r=".8"/><circle cx="15.4" cy="7.7" r=".8"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9M12 3c-3 3-4 6-4 9s1 6 4 9"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
const icon=(n,size=20)=>`<svg class="glyph s-${size}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.arrow}</svg>`;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const S={view:'discover',search:false,query:'',modal:null,saved:new Set(['solo','moon','paper']),history:false,palette:'ocean',settingsReturn:'discover'};
const getShow=id=>shows.find(s=>s.id===id)||shows[0];
function art(s,extra=''){return `<div class="art ${extra}" data-kind="${s.kind}" style="--art:${s.grad}"><span class="art-stars"></span><span class="art-disc"></span><span class="art-curve"></span><div class="art-overprint"><strong>${esc(s.title)}</strong><small>G · ${s.num}</small></div></div>`;}
function btnNav(t){return `<button type="button" class="${S.view===t?'active':''}" data-action="nav" data-view="${t}" aria-current="${S.view===t?'page':'false'}">${icon(t,16)}${t==='discover'?'Discover':t==='library'?'Library':'Downloads'}</button>`;}
function searchField(){return S.search?`<label class="search-inline">${icon('search',16)}<input id="quick-search" type="search" placeholder="Search titles in this concept…" value="${esc(S.query)}" aria-label="Search shows" autocomplete="off"><button type="button" data-action="search-close" aria-label="Close search">${icon('close',16)}</button></label>`:'';}
function listFiltered(){return shows.filter(x=>(S.view==='library'?S.saved.has(x.id):true)&&x.title.toLowerCase().includes(S.query.toLowerCase()));}
function renderedCard(s,index){return `<button type="button" data-action="detail" data-id="${s.id}" class="f-card press">${art(s)}<h3>${esc(s.title)}</h3><small>${esc(s.tags)}</small></button>`;}
function historyContent(){return `<div class="f-history"><div class="spot">✦</div><div><h3>Pick up where you left off</h3><small>Solo Leveling · Episode 04 · 18 min left</small></div><button type="button" class="f-link" data-action="history">${S.history?'Close history':'Your history'} ${icon('arrow',14)}</button></div>`;}
function extraHistory(){return S.history?`<div style="margin:15px 0" class="history-list"><div class="history-mini">${icon('play',14)} Solo Leveling · Episode 04</div><div class="history-mini">${icon('play',14)} Moonlit Signals · Episode 03</div><div class="history-mini">${icon('play',14)} Paper Crane Days · Episode 08</div></div>`:'';}
function fHeader(){return `<header class="f-head"><button type="button" class="bare f-logo" data-action="nav" data-view="discover"><span class="f-orb-mark"></span><b>gallery</b></button><nav class="f-nav" aria-label="Main navigation">${allTabs.map(t=>btnNav(t)).join('')}</nav><div class="f-actions"><button class="f-circle" type="button" aria-label="Search" data-action="search">${icon('search',20)}</button><button class="f-circle" type="button" aria-label="About this concept" data-action="sf-open">${icon('settings',20)}</button></div></header>`;}
const featured=shows[0];
function fDiscover(){const list=listFiltered().filter(s=>s.id!=='moon').slice(0,4);return `<div class="f-body app-view">${searchField()}<div class="f-greeting"><div><div class="kicker">A world of stories</div><h1>Find your <em>next</em> favorite.</h1></div><p>Make room for one more episode.</p></div><article class="f-feature"><div class="f-feature-copy"><span class="f-label">Orbit 01 · Featured story</span><h2>Moonlit<br>Signals</h2><p>${esc(featured.blurb)}</p><div class="f-cta"><button type="button" class="f-primary press" data-action="play" data-id="moon">${icon('play',16)} Start watching</button><button type="button" class="f-second press" data-action="detail" data-id="moon">Explore ${icon('arrow',16)}</button></div></div><div class="f-art">${art(featured)}<span class="satellite one"><small>Discovery no.</small><strong>001 / ∞</strong></span><span class="satellite two"><small>Currently in orbit</small><strong>Sci-fi · Drama</strong></span></div></article><section class="f-section"><div class="f-section-head"><h2>Explore the universe <span>✦ 04</span></h2><button type="button" class="f-link" data-action="nav" data-view="library">Your collection ${icon('arrow',14)}</button></div><div class="f-cards">${list.map((s,i)=>renderedCard(s,i)).join('')}</div></section>${historyContent()}${extraHistory()}</div>`;}
function subView(){const name=S.view==='library'?'Your Library':'Downloads', cols=listFiltered(), saved=S.view==='library';let content=`<div class="f-sub app-view"><div class="overline" style="color:var(--accent);margin-bottom:9px">Gallery collection</div><h1>${name}</h1><p class="tagline">${saved?'Keep every story you love in one place.':'Your downloads would appear here in the full Gallery app.'} This is a visual design study, so no files are transferred.</p>${searchField()}<div class="sub-actions"><button type="button" class="action-default" data-action="nav" data-view="discover">${icon('back',14)} Back to Discover</button>${saved?'':'<button type="button" class="action-light" data-action="nav" data-view="library">View your library</button>'}</div>`;if(saved)content+=cols.length?`<div class="sub-grid">${cols.map(s=>`<button type="button" class="sub-card press" data-action="detail" data-id="${s.id}">${art(s)}<h3>${esc(s.title)}</h3><p>${s.episodes} episodes · ${s.status}</p></button>`).join('')}</div>`:'<div class="empty-message">Nothing matches the current search.</div>';else content+=`<div class="empty-message">No downloads in this design study. The real Gallery download system remains in v103.</div>`;return content+'</div>';} 
function searchResults(){const list=listFiltered();return `<div class="f-sub app-view">${searchField()}<div class="overline" style="color:var(--accent);margin:20px 0 9px">Search / Discover</div><h1>Search results</h1><p>${list.length} title${list.length===1?'':'s'} matching “${esc(S.query)}”.</p>${list.length?`<div class="sub-grid">${list.map(s=>`<button type="button" class="sub-card press" data-action="detail" data-id="${s.id}">${art(s)}<h3>${esc(s.title)}</h3><p>${s.episodes} episodes · ${esc(s.tags)}</p></button>`).join('')}</div>`:'<div class="empty-message">No titles match your search.</div>'}</div>`;}
function modal(){if(!S.modal)return '';if(S.modal.type==='detail'){const s=getShow(S.modal.id);return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="${esc(s.title)} details"><button class="modal-close" type="button" aria-label="Close details" data-action="close">${icon('close',17)}</button><div class="modal-top">${art(s,'modal-art')}<div class="modal-details"><span class="meta">Series • ${s.status}</span><h2>${esc(s.title)}</h2><p>${esc(s.blurb)}</p><p>${s.episodes} episodes · ${esc(s.tags)}</p><div class="modal-actions"><button type="button" class="action-default" data-action="play" data-id="${s.id}">${icon('play',14)} Play preview</button><button type="button" class="action-light" data-action="save" data-id="${s.id}">${icon(S.saved.has(s.id)?'check':'plus',14)} ${S.saved.has(s.id)?'In Library':'Add to Library'}</button></div></div></div></section></div>`;}if(S.modal.type==='play'){const s=getShow(S.modal.id);return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="Playback concept"><button class="modal-close" type="button" aria-label="Close playback preview" data-action="close">${icon('close',17)}</button><div class="player-demo" style="background:${s.grad}"><div class="halo">${icon('play',32)}</div><div class="player-bottom"><span>02:41</span><span class="line"></span><span>24:30</span></div></div><div class="modal-intro"><h2>${esc(s.title)}</h2><p>Playback is only represented visually in this design concept. The real player and Watch History behavior remain in stable Gallery v103.</p><div class="modal-actions"><button type="button" class="action-default" data-action="close">Return to Discover</button></div></div></section></div>`;}return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="About this concept"><button class="modal-close" type="button" aria-label="Close" data-action="close">${icon('close',17)}</button><div class="modal-intro" style="padding:39px 36px"><span class="overline" style="color:var(--accent)">Gallery · Soft Futuristic palette study</span><h2 style="font-size:29px;margin:15px 0">Soft Futuristic</h2><p>${note}</p><p style="margin-top:18px">Try Discover, Library, details, Search and Watch History. This study preserves the original Soft Futuristic design while adding Glacier and Verdant to the four existing palettes.</p><div class="modal-actions"><button class="action-default" type="button" data-action="close">Continue exploring</button></div></div></section></div>`;}

/* Standalone Settings study: v103 sections, Soft Futuristic appearance. All values are local demo state. */
const SF_CATEGORIES=[['appearance','Appearance','palette'],['playback','Playback','play'],['downloads','Downloads','downloads'],['sources','Sources','globe'],['about','About','info']];
const SF_THEMES=[{id:'ocean',label:'Ocean',a:'#a0f1d6',bg:'#244a52',bg2:'#152d39'},{id:'twilight',label:'Twilight',a:'#c8bcff',bg:'#38345e',bg2:'#20213b'},{id:'ember',label:'Ember',a:'#f0c0ab',bg:'#573238',bg2:'#341e26'},{id:'slate',label:'Slate',a:'#c7d2da',bg:'#43505a',bg2:'#29333b'},{id:'glacier',label:'Glacier',a:'#f4fbff',bg:'#5c7489',bg2:'#222f3d'},{id:'verdant',label:'Verdant',a:'#c3efd0',bg:'#335542',bg2:'#1d3127'}];
const SF_FONT=[{id:'system',label:'System',sub:'macOS system font',style:'-apple-system,BlinkMacSystemFont,system-ui,sans-serif'},{id:'atkinson',label:'Atkinson Hyperlegible',sub:'Designed for readability',style:'"Atkinson Hyperlegible Next",system-ui,sans-serif'},{id:'inter',label:'Inter',sub:'Clean and modern',style:'Inter,system-ui,sans-serif'}];
const SF_SOURCES=[{id:'anikoto',name:'anikoto',author:'StrawVerse official repository · Demo'},{id:'animesurge',name:'Anime Surge',author:'Sample community repository · Demo'}];
const SF={section:'appearance',tabs:{appearance:'theme',playback:'general',sources:'installed'},font:'inter',audio:'sub',subsOn:true,autoplay:false,player:'built-in',downloadLang:'sub',folder:'default',subtitleSize:'N',subtitleStyle:'outline',subtitleIntensity:'Medium',subtitleColor:'default',customColor:'#d6edff',subtitleFont:'system',sources:new Set(['anikoto'])};
function sfTabs(group,items){return `<div class="sf-subtabs" role="tablist" aria-label="${group} categories">${items.map(([id,label])=>`<button type="button" role="tab" aria-selected="${SF.tabs[group]===id}" class="${SF.tabs[group]===id?'is-active':''}" data-action="sf-tab" data-group="${group}" data-tab="${id}">${label}</button>`).join('')}</div>`;}
function sfHead(){return `<header class="f-head sf-settings-head"><div class="sf-settings-brand"><span class="f-logo"><span class="f-orb-mark"></span><b>gallery</b></span><span class="sf-head-divider"></span><span class="sf-head-label">Settings</span></div><button type="button" class="sf-back" data-action="sf-back">${icon('back',16)} Back to Gallery</button></header>`;}
function sfPanelHeader(title,description,badge='Preferences'){return `<div class="sf-panel-title"><div><h2>${title}</h2><p>${description}</p></div><span class="sf-panel-count">${badge}</span></div>`;}
function sfCard(title,description,content){return `<section class="sf-card"><h3 class="sf-card-title">${title}</h3>${description?`<p class="sf-card-description">${description}</p>`:''}${content}</section>`;}
function sfToggle(label,hint,key){return `<div class="sf-field-row sf-row-switch"><div><span class="sf-field-label">${label}</span><span class="sf-field-hint">${hint}</span></div><button type="button" class="sf-switch" role="switch" aria-label="${label}" aria-checked="${SF[key]}" data-action="sf-toggle" data-key="${key}"></button></div>`;}
function sfSelect(label,hint,key,opts){return `<div class="sf-field-row"><div><label class="sf-field-label" for="sf-select-${key}">${label}</label><span class="sf-field-hint">${hint}</span></div><select class="sf-select" id="sf-select-${key}" data-sf-select="${key}">${opts.map(([val,name])=>`<option value="${val}" ${SF[key]===val?'selected':''}>${name}</option>`).join('')}</select></div>`;}
function sfAppearance(){let body=sfPanelHeader('Appearance','Shape Gallery around your preferences.','Look & feel')+sfTabs('appearance',[['theme','Themes'],['typography','Typography']]);if(SF.tabs.appearance==='theme')body+=sfCard('Choose your theme','Six different personalities, one shared interface. Select any theme to apply it instantly.',`<div class="sf-theme-grid">${SF_THEMES.map(t=>`<button type="button" class="sf-theme-tile ${S.palette===t.id?'is-active':''}" data-action="sf-palette" data-sf-palette="${t.id}" aria-pressed="${S.palette===t.id}"><span class="sf-theme-art" style="--tile-bg:${t.bg};--tile-bg2:${t.bg2};--tile-accent:${t.a}"></span><span class="sf-theme-row"><b>${t.label}</b>${S.palette===t.id?icon('check',16):''}</span></button>`).join('')}</div>`)+`<div class="sf-footnote">This study previews the six experimental Soft Futuristic themes. The original v103 themes have not been replaced.</div>`;else body+=sfCard('Typography','Choose a comfortable font for the interface. The sample changes locally when the font is installed.',`<div class="sf-font-choices">${SF_FONT.map(f=>`<button type="button" class="sf-font-tile ${SF.font===f.id?'is-active':''}" data-action="sf-font" data-font="${f.id}" aria-pressed="${SF.font===f.id}"><span class="sf-font-sample" style="font-family:${f.style}">Ag</span><span class="sf-font-check">${SF.font===f.id?icon('check',16):''}</span><b>${f.label}</b><small>${f.sub}</small></button>`).join('')}</div>`)+`<div class="sf-footnote">No fonts are downloaded. Unavailable fonts fall back to your system font.</div>`;return body;}
const SF_SIZE={XS:12,S:14,N:17,L:20,XL:23};
function sfPresets(key,vals,disabled=false){return `<div class="sf-preset-row">${vals.map(v=>`<button type="button" class="sf-preset ${SF[key]===v?'is-active':''}" data-action="sf-preset" data-key="${key}" data-choice="${v}" aria-pressed="${SF[key]===v}" ${disabled?'disabled':''}>${v.charAt(0).toUpperCase()+v.slice(1)}</button>`).join('')}</div>`;}
function sfSubtitles(){const color=SF.subtitleColor==='yellow'?'#ffe2a6':SF.subtitleColor==='custom'?SF.customColor:'#f8f8f8';const captionFont=SF.subtitleFont==='atkinson'?'"Atkinson Hyperlegible Next",system-ui,sans-serif':SF.subtitleFont==='inter'?'Inter,system-ui,sans-serif':'-apple-system,BlinkMacSystemFont,system-ui,sans-serif';const edge={Low:0.7,Medium:1.2,High:1.9,Max:2.7}[SF.subtitleIntensity];const spread={Low:3,Medium:6,High:10,Max:16}[SF.subtitleIntensity];const shadow=SF.subtitleStyle==='outline'?`${-edge}px ${-edge}px 0 #111, ${edge}px ${-edge}px 0 #111,${-edge}px ${edge}px 0 #111,${edge}px ${edge}px 0 #111,0 2px 3px #000c`:SF.subtitleStyle==='shadow'?`0 ${edge*2}px ${spread}px #000,0 ${edge*2}px ${spread*2}px #000c`:'none';return sfCard('Live subtitle preview','Adjust the typography and treatment of subtitles before you watch.',`<div class="sf-preview-box" aria-label="Illustrative subtitle preview"><div class="sf-preview-caption" data-style="${SF.subtitleStyle}" style="color:${color};--caption-size:${SF_SIZE[SF.subtitleSize]}px;font-family:${captionFont};text-shadow:${shadow}">The quick brown fox jumps over the lazy dog.</div></div><p class="sf-caption-note">Abstract preview background for this visual study; the established subtitle scene in Gallery v103 is unchanged.</p><div class="sf-inline-section"><label for="sf-select-subtitleFont">Font</label><select class="sf-select" id="sf-select-subtitleFont" data-sf-select="subtitleFont">${SF_FONT.map(f=>`<option value="${f.id}" ${SF.subtitleFont===f.id?'selected':''}>${f.label}</option>`).join('')}</select></div><div class="sf-inline-section"><label>Size</label>${sfPresets('subtitleSize',['XS','S','N','L','XL'])}</div><div class="sf-inline-section"><label>Style</label>${sfPresets('subtitleStyle',['none','outline','shadow','background'])}</div><div class="sf-inline-section"><label>Effect intensity</label>${sfPresets('subtitleIntensity',['Low','Medium','High','Max'],SF.subtitleStyle==='none')}</div><div class="sf-inline-section"><label>Text color</label><div class="sf-color-row"><button type="button" title="Soft white" aria-label="Soft white" aria-pressed="${SF.subtitleColor==='default'}" class="sf-color ${SF.subtitleColor==='default'?'is-active':''}" style="--sample:#f8f8f8" data-action="sf-preset" data-key="subtitleColor" data-choice="default"></button><button type="button" title="Warm yellow" aria-label="Warm yellow" aria-pressed="${SF.subtitleColor==='yellow'}" class="sf-color ${SF.subtitleColor==='yellow'?'is-active':''}" style="--sample:#ffe2a6" data-action="sf-preset" data-key="subtitleColor" data-choice="yellow"></button><input title="Custom subtitle color" aria-label="Custom subtitle color" type="color" class="sf-color-input" data-sf-color value="${SF.customColor}"></div></div>`);}
function sfPlayback(){let body=sfPanelHeader('Playback','The details that make watching feel effortless.','Watch & listen')+sfTabs('playback',[['general','General'],['subtitles','Subtitles']]);if(SF.tabs.playback==='subtitles')return body+sfSubtitles();return body+sfCard('Playback preferences','Choose how an episode starts and what happens when it ends.',sfSelect('Default playback audio','Preferred audio language when available.','audio',[['sub','Japanese (Sub)'],['dub','English (Dub)']])+sfToggle('Show subtitles by default','Turn subtitles on when playback begins.','subsOn')+sfToggle('Autoplay next episode','Enable the Play Next countdown near the end of an episode.','autoplay'))+sfCard('Player integration','Choose a player for local video files.',sfSelect('Preferred player','The built-in player gives Gallery the most consistent experience.','player',[['built-in','Built-in (recommended)'],['vlc','VLC (external)']])+`<p class="sf-small" style="margin:11px 0 0">External player compatibility and watch progress may vary. This is a visual-only control.</p>`);}
function sfDownloads(){return sfPanelHeader('Downloads','Choose language and destination preferences.','Storage')+sfCard('Download preferences','Applied to new downloads when a language is available.',sfSelect('Default download language','Your choice can be overridden when a source offers fewer tracks.','downloadLang',[['sub','Japanese (Sub)'],['dub','English (Dub)']]))+sfCard('Destination folder','Choose where new downloads would be saved.',`<div class="sf-route-list"><label class="sf-route"><span class="sf-route-icon">${icon('downloads',19)}</span><span class="sf-route-copy"><b>Standard Downloads folder</b><span>Use the default Downloads location on your Mac</span></span><input type="radio" name="sf-folder" value="default" ${SF.folder==='default'?'checked':''} data-sf-folder></label><label class="sf-route"><span class="sf-route-icon">${icon('folder',19)}</span><span class="sf-route-copy"><b>Custom destination</b><span>Choose a specific folder in the native app</span></span><input type="radio" name="sf-folder" value="custom" ${SF.folder==='custom'?'checked':''} data-sf-folder></label></div>${SF.folder==='custom'?'<div class="sf-footnote">Folder selection is not available in this standalone HTML concept.</div>':''}`)+`<div class="sf-footnote">No files are downloaded or moved in this experiment.</div>`;}
function sfSources(){let body=sfPanelHeader('Sources','StrawVerse-compatible providers and repositories.','Extensions')+sfTabs('sources',[['installed','Installed'],['marketplace','Marketplace'],['repositories','Repositories']]);const filter=SF.tabs.sources==='installed'?SF_SOURCES.filter(s=>SF.sources.has(s.id)):SF_SOURCES;if(SF.tabs.sources==='repositories')return body+sfCard('Repositories','Providers are organized through repositories.',`<div class="sf-source-list"><div class="sf-source"><span class="sf-source-mark">${icon('globe',19)}</span><div class="sf-source-info"><b>Official StrawVerse repository</b><span>Preconfigured · Demo entry</span></div><span class="sf-badge">Default</span></div><div class="sf-source"><span class="sf-source-mark">${icon('plus',19)}</span><div class="sf-source-info"><b>Additional repositories</b><span>Repository management would be available here</span></div><span class="sf-badge">Preview</span></div></div>`)+`<div class="sf-footnote">Repository editing is intentionally not simulated in this palette study.</div>`;return body+sfCard(SF.tabs.sources==='installed'?'Installed extensions':'Explore extensions',SF.tabs.sources==='installed'?'Providers currently enabled in the demo.':'Sample providers for comparing how source-management controls feel.',filter.length?`<div class="sf-source-list">${filter.map(s=>`<div class="sf-source"><span class="sf-source-mark">${icon('globe',19)}</span><div class="sf-source-info"><b>${s.name}</b><span>${s.author}</span></div><button type="button" class="sf-source-btn ${SF.sources.has(s.id)?'is-installed':''}" data-action="sf-source" data-source="${s.id}">${SF.sources.has(s.id)?'Remove':'Install'}</button></div>`).join('')}</div>`:'<p class="sf-small">No extensions installed in this demo. Open Marketplace to try adding one.</p>')+`<div class="sf-footnote">Install and Remove change only this page’s sample state; no extensions or network services are accessed.</div>`;}
function sfAbout(){return sfPanelHeader('About','A little more about Gallery.','Information')+sfCard('Gallery · design study','A standalone visual exploration of Soft Futuristic across the app.',`<div class="sf-about-emblem"></div><div class="sf-about-block"><b>Concept</b><span>Soft Futuristic</span></div><div class="sf-about-block"><b>Color themes</b><span>Six experimental palettes</span></div><div class="sf-about-block"><b>Reference application</b><span>Gallery v103 (unchanged)</span></div><div class="sf-about-block"><b>Compatibility goal</b><span>StrawVerse-compatible sources</span></div>`)+sfCard('Privacy & acknowledgements','The full Gallery About page contains its legal details, open-source credits, and privacy information.',`<p class="sf-small">This HTML file runs locally with no backend, external images, analytics, or web requests. The real app makes its own connections when working with external sources.</p>`);}
function sfSettings(){let main=SF.section==='appearance'?sfAppearance():SF.section==='playback'?sfPlayback():SF.section==='downloads'?sfDownloads():SF.section==='sources'?sfSources():sfAbout();return `<div class="sf-settings-shell app-view"><div class="sf-settings-intro"><div><div class="sf-settings-kicker">Make it yours</div><h1>Settings</h1><p>All the little details, thoughtfully in place.</p></div><span class="sf-settings-note">Soft Futuristic · concept only</span></div><div class="sf-settings-layout"><nav class="sf-side" aria-label="Settings sections"><span class="sf-side-caption">Customize Gallery</span>${SF_CATEGORIES.map(([id,label,ic])=>`<button type="button" class="${SF.section===id?'is-active':''}" data-action="sf-section" data-section="${id}" aria-current="${SF.section===id?'page':'false'}">${icon(ic,17)}<span>${label}</span><span class="sf-arrow">${icon('arrow',13)}</span></button>`).join('')}</nav><div class="sf-settings-panel" id="sf-settings-panel">${main}</div></div></div>`;}

function render(keepScroll=false){const host=$('#canvas'), previous=keepScroll?$('.app-content')?.scrollTop:0;const searchOnDiscover=S.view==='discover'&&S.search&&S.query.trim();const content=S.view==='settings'?sfSettings():searchOnDiscover?searchResults():S.view!=='discover'?subView():fDiscover();host.innerHTML=`<section class="design futuristic" aria-label="Soft Futuristic Gallery concept">${S.view==='settings'?sfHead():fHeader()}<div class="app-content">${content}</div>${modal()}</section>`;if(keepScroll&&$('.app-content'))$('.app-content').scrollTop=previous;if(S.modal){document.body.classList.add('lock');$('.modal-close')?.focus({preventScroll:true});}else document.body.classList.remove('lock');}
function setPalette(name){S.palette=name;document.body.dataset.palette=name;document.querySelectorAll('[data-palette]').forEach(b=>{if(b.closest('.palette-switch'))b.setAttribute('aria-pressed',String(b.dataset.palette===name));});if(S.view==='settings'&&SF.section==='appearance'&&SF.tabs.appearance==='theme')render(true);}
document.addEventListener('click',e=>{const palette=e.target.closest('.palette-switch [data-palette]');if(palette){setPalette(palette.dataset.palette);return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='sf-open'){S.settingsReturn=S.view;S.view='settings';S.search=false;S.query='';S.modal=null;SF.section='appearance';SF.tabs.appearance='theme';render();return;}
if(a==='sf-back'){S.view=S.settingsReturn==='settings'?'discover':S.settingsReturn;render();return;}
if(a==='sf-section'){SF.section=el.dataset.section;render();return;}
if(a==='sf-tab'){SF.tabs[el.dataset.group]=el.dataset.tab;render(true);return;}
if(a==='sf-palette'){setPalette(el.dataset.sfPalette);return;}
if(a==='sf-font'){SF.font=el.dataset.font;document.body.dataset.appFont=SF.font;render(true);return;}
if(a==='sf-toggle'){SF[el.dataset.key]=!SF[el.dataset.key];render(true);return;}
if(a==='sf-preset'){SF[el.dataset.key]=el.dataset.choice;render(true);return;}
if(a==='sf-source'){const id=el.dataset.source;if(SF.sources.has(id))SF.sources.delete(id);else SF.sources.add(id);render(true);return;}
if(a==='close-backdrop'){if(e.target===el){S.modal=null;render(true);}return;}if(a==='nav'){S.view=el.dataset.view;S.search=false;S.query='';S.modal=null;S.history=false;render();return;}if(a==='search'){S.search=!S.search;S.query='';render(true);if(S.search)$('#quick-search')?.focus();return;}if(a==='search-close'){S.search=false;S.query='';render(true);return;}if(a==='detail'){S.modal={type:'detail',id:el.dataset.id};render(true);return;}if(a==='play'){S.modal={type:'play',id:el.dataset.id};render(true);return;}if(a==='about'){S.modal={type:'about'};render(true);return;}if(a==='history'){S.history=!S.history;render(true);return;}if(a==='save'){const id=el.dataset.id;if(S.saved.has(id))S.saved.delete(id);else S.saved.add(id);render(true);return;}if(a==='close'){S.modal=null;render(true);return;}});
document.addEventListener('change',e=>{const sel=e.target.closest('[data-sf-select]');if(sel){SF[sel.dataset.sfSelect]=sel.value;return;}if(e.target.matches('[data-sf-folder]')){SF.folder=e.target.value;render(true);return;}});
document.addEventListener('input',e=>{if(e.target.matches('[data-sf-color]')){SF.customColor=e.target.value;SF.subtitleColor='custom';const caption=$('.sf-preview-caption');if(caption)caption.style.color=e.target.value;document.querySelectorAll('.sf-color').forEach(x=>x.classList.remove('is-active'));return;}if(e.target?.id!=='quick-search')return;const input=e.target, value=input.value, pos=input.selectionStart;S.query=value;render(true);const fresh=$('#quick-search');if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos);}catch{}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render(true);}else if(S.search){S.search=false;S.query='';render(true);}return;}});
setPalette('ocean');render();
})();
</script>
</body>
</html>
