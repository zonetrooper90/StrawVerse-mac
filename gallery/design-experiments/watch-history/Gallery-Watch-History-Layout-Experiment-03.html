 {id:'violet',title:'Violet Evergarden',short:'Violet',cover:'linear-gradient(145deg,#465b8a,#7b99ba 51%,#cfb69b)',library:true,last:'2025-08-20',dates:['2025-08-20'],episodes:createEpisodes(13,13)},
 {id:'moon',title:'Moonlit Signals 2025',short:'Moonlit',cover:'linear-gradient(145deg,#322554,#74548f 51%,#c48b9c)',library:false,last:'2026-01-15',dates:['2026-01-15'],episodes:createEpisodes(12,3,4,319)},
 {id:'aot',title:'Attack on Titan: The Final Season',short:'AoT',cover:'linear-gradient(150deg,#334447,#697b77 50%,#958c76)',library:true,last:'2025-04-10',dates:['2025-04-10'],episodes:createEpisodes(16,9,10,611)},
 {id:'astra',title:'Astra Afterlight',short:'Astra',cover:'linear-gradient(145deg,#213654,#386e88 50%,#88c2c1)',library:false,last:'2024-12-16',dates:['2024-12-16'],episodes:createEpisodes(12,12)}
];
let view='history',statusFilter='all',sortDirection='newest',query='',expanded=new Set(),pendingRemoved=new Set();
let mainScroller=null,innerScrollers=new Map(),toastTimer=null;
const page=document.getElementById('page'),mainScroll=document.getElementById('content-scroll'),searchWrap=document.getElementById('search-wrap'),searchInput=document.getElementById('search-input');
function countWatched(r){return r.episodes.filter(e=>e.watched).length;}
function isCompleted(r){return r.episodes.length>0&&countWatched(r)===r.episodes.length;}
function formatDate(date){return new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmt(seconds){return `${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;}
function lastPlayedEpisode(r){return [...r.episodes].reverse().find(e=>e.started)||r.episodes[0];}
function relevantMoment(r){const ep=lastPlayedEpisode(r);return `Episode ${ep.n} · ${fmt(ep.progressSeconds)} / ${fmt(ep.duration)}`;}
function sorted(arr){return [...arr].sort((a,b)=>sortDirection==='newest'?b.last.localeCompare(a.last):a.last.localeCompare(b.last));}
const months=['january','february','march','april','may','june','july','august','september','october','november','december'];
function searchGroups(list){
 const q=query.trim().toLowerCase();
 if(!q)return [{label:null,items:sorted(list)}];
 const singleYear=/^(19|20)\d{2}$/.test(q);
 const lastYear=q==='last year';
 const m=q.match(/^([a-z]+)\s+((?:19|20)\d{2})$/);
 const month=m?months.indexOf(m[1]):-1;
 const year=singleYear?q:lastYear?String(new Date().getFullYear()-1):(m&&month!==-1?m[2]:null);
 const datePredicate=(r)=>year!==null && r.dates.some(d=>d.startsWith(year)&&(month===-1||Number(d.slice(5,7))===month+1));
 const titlePredicate=(r)=>r.title.toLowerCase().includes(q);
 if(year!==null){
   const dateMatches=sorted(list.filter(datePredicate));
   const byDate=new Set(dateMatches.map(r=>r.id));
   const titleMatches=sorted(list.filter(r=>!byDate.has(r.id)&&titlePredicate(r)));
   return [{label:month!==-1?`Watched in ${months[month][0].toUpperCase()+months[month].slice(1)} ${year}`:`Watched in ${year}`,items:dateMatches},{label:'Title matches',items:titleMatches}].filter(group=>group.items.length);
 }
 return [{label:null,items:sorted(list.filter(titlePredicate))}];
}
function visibleGroups(){const active=records.filter(r=>!pendingRemoved.has(r.id)&& (statusFilter==='all'||(statusFilter==='completed')===isCompleted(r)));return searchGroups(active);}
function renderHistory({preserveScroll=true}={}){
 if(view!=='history')return;
 const prevY=preserveScroll?mainScroll.scrollTop:0;
 const innerPositions=new Map([...innerScrollers.entries()].map(([id,s])=>[id,s.el.scrollTop]));
 innerScrollers.forEach(s=>s.destroy());innerScrollers.clear();
 const groups=visibleGroups();const count=groups.reduce((sum,g)=>sum+g.items.length,0);
 const removedList=records.filter(r=>pendingRemoved.has(r.id));
 page.innerHTML=`
  <div class="page-topline"><button class="back" type="button" data-action="leave">${icon('arrowLeft')} Discover</button><span class="test-note">Interactive layout study · Not connected to playback</span></div>
  <div class="page-header">
    <div class="page-header-primary"><h1 class="page-title">Watch History</h1></div>
    <p class="page-caption">Your viewing history, one entry per anime season.</p>
    <div class="header-divider"></div>
    <div class="page-controls"><div class="segmented" role="group" aria-label="Filter Watch History">
      ${[['all','All'],['progress','In Progress'],['completed','Completed']].map(([v,label])=>`<button type="button" data-filter="${v}" aria-pressed="${statusFilter===v}">${label}</button>`).join('')}
      </div><button class="sort-button ${sortDirection==='oldest'?'oldest':''}" type="button" data-action="sort" title="Reverse history sorting">${icon('sort','icon sort-arrow')}<span>${sortDirection==='newest'?'Newest First':'Oldest First'}</span></button></div>
  </div>
  ${removedList.length?`<div class="undo-tray" role="region" aria-label="Pending history removals">
   <div class="undo-top"><div><strong>${removedList.length} ${removedList.length===1?'season':'seasons'} removed from view</strong><div class="hint">You can restore ${removedList.length===1?'it':'them'} until you leave Watch History.</div></div><button type="button" class="btn" data-action="restore-all">Undo all</button></div>
   <div class="undo-items">${removedList.map(r=>`<div class="undo-chip"><span class="name">${esc(r.title)}</span><button type="button" data-restore="${esc(r.id)}" aria-label="Undo removal of ${esc(r.title)}">Undo</button></div>`).join('')}</div>
   </div>`:''}
  <div class="result-summary">${count} ${count===1?'season':'seasons'} ${query?'matching your search':'in this view'}${query?' · Search and filter work together':''}</div>
  ${count?groups.map(g=>`${g.label?`<div class="results-heading">${esc(g.label)}</div>`:''}<div class="row-list">${g.items.map(renderRow).join('')}</div>`).join(''):
   `<div class="empty">${icon('checkCircle','icon')}<h2>Nothing to show</h2><p>${query?'Try a different title, year, or month.':'Try another filter, or undo a removed season.'}</p></div>`}
  <div class="info-note"><strong>Experiment only.</strong> Covers are CSS placeholders. Episode statuses and dates are example data; changes here aren't saved to Gallery. Click titles to see the intended Library/Discover routing, expand seasons to correct watched episodes, or try the session-long Undo.</div>
 `;
 for(const id of expanded){
  const panel=page.querySelector(`[data-episode-shell="${id}"]`);
  if(!panel)continue;
  const area=panel.querySelector('.episode-scroll');
  const ctrl=attachDisappearingScrollbar(area,panel.querySelector('.scroll-overlay'));
  innerScrollers.set(id,ctrl);
  if(innerPositions.has(id)){area.scrollTop=innerPositions.get(id);}else{
   const r=records.find(r=>r.id===id),last=lastPlayedEpisode(r),idx=last.n-1;
   const cols=window.matchMedia('(max-width:820px)').matches?1:2;
   if(r.episodes.length>6*cols)area.scrollTop=Math.max(0,(Math.floor(idx/cols)-2)*42);
  }
  ctrl.update();
 }
 mainScroll.scrollTop=prevY;
 mainScroller?.update();
}
function renderSummary(r){
 const completed=isCompleted(r),numWatched=countWatched(r),open=expanded.has(r.id),pct=numWatched/r.episodes.length*100;
 return `<div class="history-summary">
   <button type="button" class="cover-link" data-open="${r.id}" aria-label="Open ${esc(r.title)} in ${r.library?'Library':'Discover'}"><div class="cover" style="--cover:${r.cover}"><span class="cover-label">${esc(r.short)}</span></div></button>
   <div class="history-copy"><button type="button" class="history-title" data-open="${r.id}">${esc(r.title)}</button>
    ${completed?`<div class="history-status">${icon('checkCircle')} Completed</div>`:
     `<div class="meta-line">${esc(relevantMoment(r))}</div><div class="meta-line secondary">${numWatched} of ${r.episodes.length} episodes watched</div><div class="progress-bits" aria-hidden="true"><div class="progress-done" style="width:calc(${pct}% - ${pct>0&&pct<100?'3px':'0px'})"></div>${pct<100?'<div class="progress-left"></div>':''}</div>`}
    <div class="meta-line secondary">Last watched ${formatDate(r.last)}</div>
   </div>
   <div class="row-actions"><button class="action-icon chevron" type="button" data-expand="${r.id}" aria-expanded="${open}" aria-label="${open?'Collapse':'Expand'} episodes for ${esc(r.title)}" title="${open?'Collapse':'Manage watched episodes'}">${icon('chevronDown')}</button><button class="action-icon trash" type="button" data-remove="${r.id}" aria-label="Remove ${esc(r.title)} from Watch History" title="Remove from Watch History">${icon('trash')}</button></div>
  </div>`;
}
function renderRow(r){
 const numWatched=countWatched(r),open=expanded.has(r.id);
 return `<section class="history-row ${open?'expanded':''}" data-history-row="${r.id}" aria-label="${esc(r.title)}">
  ${renderSummary(r)}
  ${open?`<div class="episodes-panel"><div class="episodes-head"><strong>Episodes</strong><span>${numWatched} / ${r.episodes.length} watched</span></div>
   <div class="episode-scroll-shell" data-episode-shell="${r.id}"><div class="episode-scroll" tabindex="0" role="region" aria-label="Scrollable episodes for ${esc(r.title)}">${r.episodes.map(ep=>renderEpisode(r,ep)).join('')}</div><div class="scroll-overlay" aria-hidden="true"><div class="scroll-thumb"></div></div></div>
   <div class="episode-hint">Select the status control to mark or unmark an episode. Playback positions stay separate from completion. ${r.episodes.length>(window.matchMedia('(max-width:820px)').matches?6:12)?'Scroll inside this list to reach every episode.':''}</div></div>`:''}
 </section>`;
}
function updateEpisodeInPlace(button,r,ep){
 // Keep the expanded panel and all scrollbar handlers mounted; update only the
 // selected episode, its season summary and the expanded header count.
 const state=ep.watched?'watched':ep.started?'partial':'never';
 const label=ep.watched?'Watched':ep.started?'Partially watched':'Not watched';
 button.setAttribute('aria-pressed',String(ep.watched));
 button.title=ep.watched?'Unmark episode as Watched':'Mark episode as Watched';
 const symbol=button.querySelector('.status-icon');
 symbol.className='status-icon '+state;
 symbol.innerHTML=ep.watched?icon('check','icon'):'';
 button.querySelector('.episode-status-label').textContent=label;
 const episodeMain=button.closest('.episode-row').querySelector('.episode-row-main');
 let progress=episodeMain.querySelector('.episode-progress');
 if(ep.started&&!ep.watched){
  if(!progress){progress=document.createElement('span');progress.className='episode-progress';episodeMain.append(progress);}
  progress.textContent=`${fmt(ep.progressSeconds)} / ${fmt(ep.duration)}`;
 }else{progress?.remove();}
 const season=button.closest('.history-row');
 const summaryTemplate=document.createElement('template');
 summaryTemplate.innerHTML=renderSummary(r);
 season.querySelector('.history-summary').replaceWith(summaryTemplate.content.firstElementChild);
 season.querySelector('.episodes-head span').textContent=`${countWatched(r)} / ${r.episodes.length} watched`;
 // No page-wide renderHistory(), no flash, no scroll jump and no focus reset.
}
function renderEpisode(r,ep){
 const state=ep.watched?'watched':ep.started?'partial':'never';
 const label=ep.watched?'Watched':ep.started?'Partially watched':'Not watched';
 const progress=ep.started&&!ep.watched?`<span class="episode-progress">${fmt(ep.progressSeconds)} / ${fmt(ep.duration)}</span>`:'';
 return `<div class="episode-row"><div class="episode-row-main"><span class="episode-number">Episode ${ep.n}</span>${progress}</div><button type="button" class="episode-toggle" data-toggle-episode="${r.id}:${ep.n}" aria-pressed="${ep.watched}" title="${ep.watched?'Unmark episode as Watched':'Mark episode as Watched'}"><span class="status-icon ${state}">${ep.watched?icon('check','icon'):''}</span><span class="episode-status-label">${label}</span></button></div>`;
}
function renderPlaceholder(tab='discover'){
 const title=tab[0].toUpperCase()+tab.slice(1);
 page.innerHTML=`<div class="placeholder"><h2>${esc(title)}</h2><p>This is a standalone <strong>Watch History layout experiment</strong>, not a rebuild of ${esc(title)}. Leaving the history page commits any pending removals and resets search, filters and sort order as agreed.</p><button class="btn primary" data-action="return-history">Open Watch History</button></div>`;
 mainScroll.scrollTop=0;mainScroller?.update();
}
function setView(next){
 if(next!==view){
  if(view==='history'&&next!=='history'){
   for(let i=records.length-1;i>=0;i--)if(pendingRemoved.has(records[i].id))records.splice(i,1);
   pendingRemoved.clear();expanded.clear();statusFilter='all';sortDirection='newest';query='';closeSearch();
  }
  view=next;
  document.querySelectorAll('.tab').forEach(t=>{const is=t.dataset.tab===(next==='history'?'discover':next);t.classList.toggle('active',is);t.setAttribute('aria-current',is?'page':'false');});
 }
 if(next==='history')renderHistory({preserveScroll:false});else renderPlaceholder(next);
}
function closeSearch(){searchWrap.classList.remove('open');document.getElementById('search-toggle').setAttribute('aria-expanded','false');searchInput.value='';}
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3600);}
function attachDisappearingScrollbar(el,overlay){
 // Mirrors Gallery v99: hidden native scrollbar, one overlay thumb, fade ~950ms after scrolling,
 // no gutter, and a draggable visible thumb.
 const thumb=overlay.querySelector('.scroll-thumb');let fadeTimer=null,dragging=false,dragY=0,dragTop=0,intentUntil=0;
 function update(){const max=el.scrollHeight-el.clientHeight,h=overlay.clientHeight;if(max<=1||h<=0){overlay.classList.remove('is-visible');return false;}
  const th=Math.min(h,Math.max(40,Math.round(h*el.clientHeight/el.scrollHeight)));
  const top=(h-th)*(el.scrollTop/max);thumb.style.height=th+'px';thumb.style.transform=`translate3d(0,${top}px,0)`;return true;
 }
 function reveal(){if(!update())return;overlay.classList.add('is-visible');clearTimeout(fadeTimer);fadeTimer=setTimeout(()=>{if(!dragging)overlay.classList.remove('is-visible');},950);}
 function userScrolled(){intentUntil=performance.now()+1400;reveal();}
 function onWheel(){userScrolled();}
 function onTouch(){userScrolled();}
 function onScroll(){update();if(performance.now()<intentUntil||dragging)reveal();}
 function onKey(ev){if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(ev.key))userScrolled();}
 function onDown(ev){if(ev.button!==0||!update())return;ev.preventDefault();dragging=true;dragY=ev.clientY;dragTop=el.scrollTop;overlay.classList.add('is-visible','is-dragging');clearTimeout(fadeTimer);thumb.setPointerCapture(ev.pointerId);}
 function onMove(ev){if(!dragging)return;const distance=overlay.clientHeight-thumb.getBoundingClientRect().height,max=el.scrollHeight-el.clientHeight;if(distance>0)el.scrollTop=dragTop+(ev.clientY-dragY)*max/distance;reveal();}
 function onUp(){if(!dragging)return;dragging=false;overlay.classList.remove('is-dragging');reveal();}
 el.addEventListener('wheel',onWheel,{passive:true});el.addEventListener('touchmove',onTouch,{passive:true});el.addEventListener('scroll',onScroll,{passive:true});el.addEventListener('keydown',onKey);
 thumb.addEventListener('pointerdown',onDown);thumb.addEventListener('pointermove',onMove);thumb.addEventListener('pointerup',onUp);thumb.addEventListener('pointercancel',onUp);thumb.addEventListener('lostpointercapture',onUp);
 return {el,update,reveal,destroy(){clearTimeout(fadeTimer);el.removeEventListener('wheel',onWheel);el.removeEventListener('touchmove',onTouch);el.removeEventListener('scroll',onScroll);el.removeEventListener('keydown',onKey);thumb.removeEventListener('pointerdown',onDown);thumb.removeEventListener('pointermove',onMove);thumb.removeEventListener('pointerup',onUp);thumb.removeEventListener('pointercancel',onUp);thumb.removeEventListener('lostpointercapture',onUp);}};
}
page.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.filter){statusFilter=b.dataset.filter;renderHistory();return;}
 if(b.dataset.action==='sort'){sortDirection=sortDirection==='newest'?'oldest':'newest';renderHistory();return;}
 if(b.dataset.expand){const id=b.dataset.expand;const was=expanded.has(id);if(was)expanded.delete(id);else expanded.add(id);renderHistory();return;}
 if(b.dataset.remove){pendingRemoved.add(b.dataset.remove);expanded.delete(b.dataset.remove);renderHistory();showToast('Removed from this view. Undo remains available until you leave Watch History.');return;}
 if(b.dataset.restore){pendingRemoved.delete(b.dataset.restore);renderHistory();return;}
 if(b.dataset.action==='restore-all'){pendingRemoved.clear();renderHistory();return;}
 if(b.dataset.open){const r=records.find(x=>x.id===b.dataset.open);showToast(`In Gallery, this opens ${r.title} in ${r.library?'Library':'Discover'}. This experiment does not duplicate that page.`);return;}
 if(b.dataset.toggleEpisode){const [id,nText]=b.dataset.toggleEpisode.split(':'),r=records.find(x=>x.id===id),e=r.episodes[Number(nText)-1];
  // Unmarking doesn't discard saved playback position; it becomes Partial if playback was recorded.
  e.watched=!e.watched;
  updateEpisodeInPlace(b,r,e);return;
 }
 if(b.dataset.action==='leave'){setView('discover');return;}
 if(b.dataset.action==='return-history'){setView('history');return;}
});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.tab)));
document.getElementById('search-toggle').addEventListener('click',()=>{
 if(view!=='history'){setView('history');}
 const open=!searchWrap.classList.contains('open');searchWrap.classList.toggle('open',open);document.getElementById('search-toggle').setAttribute('aria-expanded',String(open));if(open){searchInput.focus();}else{query='';searchInput.value='';renderHistory();}
});
document.getElementById('search-close').addEventListener('click',()=>{query='';closeSearch();renderHistory();});
searchInput.addEventListener('input',()=>{query=searchInput.value;renderHistory({preserveScroll:false});});
const themes=['neon','midnight','paper'];document.getElementById('theme-toggle').addEventListener('click',()=>{const idx=themes.indexOf(document.body.dataset.theme);document.body.dataset.theme=themes[(idx+1)%themes.length];showToast('Preview theme: '+document.body.dataset.theme);});
mainScroller=attachDisappearingScrollbar(mainScroll,document.getElementById('main-overlay'));
const resizeObserver=new ResizeObserver(()=>{mainScroller.update();for(const s of innerScrollers.values())s.update();});resizeObserver.observe(document.getElementById('content-shell'));
renderHistory({preserveScroll:false});
</script>
